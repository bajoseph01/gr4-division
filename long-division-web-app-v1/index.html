<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Long Division Web App v1</title>
<style>
:root{
  --ink:#0b0b0b;--paper:#fff;--bg:#f2f4f7;
  --green:#bfe6a8;--green2:#5a9d35;
  --orange:#ffd29b;--orange2:#e68a24;
  --red:#ff9d9d;--red2:#df4040;
  --black:#111;--black2:#333;
  --purple:#d9c2ff;--purple2:#7a3ec8;
  --blue:#2356b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button,select,input{font:inherit}
.app{max-width:1540px;margin:auto;padding:14px}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:rgba(255,255,255,.96);border:1px solid #d6dce3;border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.09);margin-bottom:12px}
.toolbar label{font-weight:800;font-size:13px;color:#344054}
.toolbar select,.toolbar input{height:36px;border:1px solid #cfd7df;border-radius:10px;background:white;padding:0 10px}
.btn{height:36px;border:0;border-radius:10px;padding:0 12px;font-weight:900;background:#111;color:#fff;cursor:pointer}
.btn.light{background:#fff;color:#111;border:1px solid #cfd7df}
.btn.blue{background:var(--blue)}
.btn.green{background:#2f7d32}
.btn.red{background:#b42323}
.status{font-size:13px;font-weight:800;color:#344054;min-width:190px;text-align:center}
.wrap{display:flex;justify-content:center}
#sheet{width:min(1488px,98vw);aspect-ratio:1.414/1;background:var(--paper);border:2px solid #111;box-shadow:0 18px 42px rgba(16,24,40,.18);padding:10px 16px 28px;overflow:hidden}
.header{height:176px;position:relative;text-align:center}
.title{margin:0;font-size:clamp(42px,5.2vw,76px);font-weight:1000;line-height:.98;letter-spacing:.2px;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
.subtitle{margin-top:6px;font-size:clamp(19px,2.1vw,29px);font-weight:900}
.namebox{position:absolute;right:8px;top:38px;width:305px;text-align:left;font-size:18px;font-weight:900}
.linefield{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.linefield span:last-child{height:1.5px;background:#111;flex:1}
.tip{position:absolute;left:50%;top:116px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:12px;border:2px solid #111;border-radius:12px;background:#fffef7;padding:10px 18px;font-size:clamp(16px,1.65vw,23px);font-weight:800;white-space:nowrap}
.bulb{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff3a4;border:1px solid #d8bb43}
.panels{height:calc(100% - 176px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:22px}
.panel{position:relative;border:2px solid #111;border-radius:12px;background:#fff;padding:34px 12px 13px;display:grid;grid-template-columns:63% 37%;grid-template-rows:1fr auto;overflow:visible}
.tab{position:absolute;top:-22px;left:24px;height:39px;min-width:198px;border-radius:8px;border:2px solid;padding:7px 18px 6px;font-size:18px;font-weight:900;text-align:center}
.green .tab{background:var(--green);border-color:var(--green2)}
.orange .tab{background:var(--orange);border-color:var(--orange2)}
.red .tab{background:var(--red);border-color:var(--red2)}
.black .tab{background:var(--black);border-color:var(--black2);color:#fff}
.purple .tab{background:var(--purple);border-color:var(--purple2);color:#250044}
.problem{padding:0 12px 0 5px}
.sum{font-size:32px;font-weight:900;text-align:center;margin:0 0 22px}
.division{display:grid;grid-template-columns:54px 1fr;grid-template-rows:34px auto;min-height:178px}
.divisor{grid-column:1;grid-row:2;padding-top:13px;text-align:right;padding-right:16px;font-size:31px;font-weight:900}
.qrow{grid-column:2;grid-row:1;display:grid;gap:8px;padding-left:18px;padding-right:20px}
.qslot{height:28px;border:0;border-bottom:3px solid #a2a2a2;text-align:center;font-size:25px;font-weight:900;background:transparent;outline:none}
.qslot:focus{border-bottom-color:var(--blue);background:#eef4ff}
.good{border-color:#2f7d32!important;background:#eefbea!important}
.bad{border-color:#c62828!important;background:#fff1f1!important}
.bracket{grid-column:2;grid-row:2;min-height:166px;border-left:4px solid #111;border-top:4px solid #111;border-top-left-radius:13px;padding:10px 16px 10px 18px}
.digits{display:grid;gap:8px;font-size:31px;font-weight:900;text-align:center}
.workpad{margin-top:13px;min-height:100px;border:1px dashed transparent;border-radius:8px;padding:6px 8px;font-size:22px;line-height:1.35;white-space:pre-wrap;outline:none}
.workpad:focus{border-color:#b9c7d8;background:#fbfdff}
.steps{border-left:2px dashed #c9c9c9;padding-left:30px;padding-top:16px;display:flex;flex-direction:column;gap:17px}
.step{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;white-space:nowrap}
.step input{appearance:none;width:22px;height:22px;border:1.8px solid #777;background:white;margin:0}
.step input:checked{background:#111;border-color:#111}
.step input:checked:after{content:"✓";display:block;color:white;text-align:center;font-size:17px;font-weight:900}
.footer{grid-column:1/3;border-top:2px solid #111;margin-top:6px;padding-top:8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:center;font-size:15px}
.footer strong{font-weight:900}
.answer{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:13px;font-weight:900}
.answer input{width:42px;height:28px;border:1.6px solid #111;border-radius:6px;text-align:center;font-weight:900}
.feedback{position:absolute;left:16px;right:16px;bottom:44px;display:none;padding:5px 8px;border-radius:8px;font-size:13px;font-weight:900;text-align:center}
.feedback.show{display:block}
.feedback.ok{background:#edf8ed;color:#236528;border:1px solid #9dcc9d}
.feedback.no{background:#fff0f0;color:#a01818;border:1px solid #eeaaaa}
.badge{position:absolute;right:15px;top:11px;display:none;padding:5px 9px;border-radius:999px;background:#111;color:#fff;font-size:13px;font-weight:900}
body.show-answers .badge{display:block}
.note{max-width:1488px;margin:10px auto 0;color:#475467;font-size:13px;text-align:center}
@media(max-width:900px){.wrap{overflow:auto;justify-content:flex-start}#sheet{width:1200px;max-width:none}.toolbar{position:relative}.status{width:100%}}
@page{size:A4 landscape;margin:6mm}
@media print{
  body{background:white}.app{padding:0;max-width:none}.toolbar,.note,.answer,.feedback,.badge{display:none!important}
  #sheet{width:100%;height:auto;box-shadow:none;border:1.5px solid #111;padding:6px 10px 22px}
  .header{height:148px}.title{font-size:50px}.subtitle{font-size:20px}.tip{top:100px;font-size:16px;padding:7px 12px}.bulb{width:26px;height:26px}.namebox{font-size:15px;top:33px;width:260px}
  .panels{height:calc(100% - 148px);gap:15px}.panel{padding:28px 10px 10px}.tab{top:-18px;height:32px;min-width:168px;font-size:14px;padding:6px 10px}.sum{font-size:24px;margin-bottom:16px}.divisor,.digits{font-size:25px}.qslot{font-size:1px;color:transparent!important;background:transparent!important;border-bottom:2px solid #999!important}.bracket{border-left-width:3px;border-top-width:3px;min-height:136px}.division{grid-template-columns:42px 1fr;min-height:145px}.workpad{min-height:72px}.steps{gap:11px;padding-left:22px;padding-top:12px}.step{font-size:13px}.step input{width:17px;height:17px}.footer{font-size:11.5px;padding-top:6px}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <label>Mode <select id="mode"><option value="teacher">Teacher board</option><option value="practice">Student practice</option><option value="print">Printable preview</option></select></label>
    <label>Question set <select id="set"><option value="classic">Classic worksheet</option><option value="balanced">Balanced random</option><option value="easy">Easier</option><option value="challenge">Challenge random</option><option value="challengeBlack">Challenge – Black</option><option value="challengePurple">Challenge – Purple</option></select></label>
    <button class="btn blue" id="newBtn">Generate set</button>
    <button class="btn green" id="markBtn">Mark answers</button>
    <button class="btn light" id="ansBtn">Show answers</button>
    <button class="btn light" id="clearBtn">Clear work</button>
    <button class="btn red" id="printBtn">Print worksheet</button>
    <span class="status" id="status">Ready.</span>
  </div>
  <div class="wrap"><main id="sheet">
    <header class="header">
      <h1 class="title">Long Division Practice</h1>
      <div class="subtitle" id="subtitle">Divide • Multiply • Subtract • Bring down • Repeat</div>
      <div class="namebox"><div class="linefield"><span>Name:</span><span></span></div><div class="linefield"><span>Date:</span><span></span></div></div>
      <div class="tip"><span class="bulb">💡</span><span>After you bring down, ask: Can I divide again?</span></div>
    </header>
    <section class="panels" id="panels"></section>
  </main></div>
  <div class="note">Designed for Grade 4 long division: same worksheet look, interactive screen work, printable output, and simple self-marking.</div>
</div>
<script>
const $=s=>document.querySelector(s);
const panels=$('#panels'),status=$('#status'),subtitle=$('#subtitle');
let problems=[];

const classic=[
  ['green','1. Green – Exact',48,2],['orange','2. Orange – Exact',248,4],['red','3. Red – Exact',864,4],
  ['green','4. Green – Remainder',85,4],['orange','5. Orange – Remainder',137,5],['red','6. Red – Remainder',529,7]
];

const challengeBlack=[
  ['black','1. Black Challenge',375,9],
  ['black','2. Black Challenge',132,5],
  ['black','3. Black Challenge',999,4],
  ['black','4. Black Challenge',856,8],
  ['black','5. Black Challenge',684,7],
  ['black','6. Black Challenge',743,6]
];

const challengePurple=[
  ['purple','1. Purple Challenge',4735,3],
  ['purple','2. Purple Challenge',4735,15],
  ['purple','3. Purple Challenge',8624,7],
  ['purple','4. Purple Challenge',9876,8],
  ['purple','5. Purple Challenge',7392,12],
  ['purple','6. Purple Challenge',8457,16]
];

function q(a,b){return Math.floor(a/b)}
function r(a,b){return a%b}
function digits(n){return String(n).split('')}
function slots(a,b){return String(q(a,b)).padStart(String(a).length,' ').split('')}
function fromList(list){return list.map(x=>({level:x[0],label:x[1],dividend:x[2],divisor:x[3]}))}

function makeProblem(level,label,exact){
  let divs=level==='green'?[2,3,4,5]:level==='orange'?[3,4,5,6,7]:[4,6,7,8,9];
  let d=divs[Math.floor(Math.random()*divs.length)],min=level==='green'?24:level==='orange'?110:300,max=level==='green'?99:level==='orange'?399:999;
  let n=0,guard=0;
  do{n=Math.floor(Math.random()*(max-min+1))+min;guard++}while(((n%d===0)!==exact||q(n,d)<10)&&guard<500);
  return{level,label,dividend:n,divisor:d}
}

function build(kind){
  if(kind==='classic')return fromList(classic);
  if(kind==='challengeBlack')return fromList(challengeBlack);
  if(kind==='challengePurple')return fromList(challengePurple);
  let easy=kind==='easy',challenge=kind==='challenge';
  let specs=[['green','1. Green – Exact',true],['orange','2. Orange – Exact',true],['red','3. Red – Exact',true],['green','4. Green – Remainder',false],['orange','5. Orange – Remainder',false],['red','6. Red – Remainder',false]];
  return specs.map(s=>makeProblem(easy&&s[0]==='red'?'orange':challenge&&s[0]==='green'?'orange':s[0],s[1],s[2]))
}

function setHeading(){
  const kind=$('#set').value;
  const text={
    classic:'Divide • Multiply • Subtract • Bring down • Repeat',
    balanced:'Balanced random practice',
    easy:'Easier practice',
    challenge:'Challenge random practice',
    challengeBlack:'Black Challenge • 3-digit division',
    challengePurple:'Purple Challenge • higher level division'
  }[kind]||'Divide • Multiply • Subtract • Bring down • Repeat';
  subtitle.textContent=text;
}

function render(){
  panels.innerHTML='';
  problems.forEach((p,i)=>{
    let ds=digits(p.dividend),ans=q(p.dividend,p.divisor),rem=r(p.dividend,p.divisor);
    let el=document.createElement('article');
    el.className='panel '+p.level;
    el.dataset.i=i;
    el.innerHTML=`<div class="tab">${p.label}</div><div class="badge">${ans}${rem?' R '+rem:''}</div><div class="problem"><div class="sum">${p.dividend} ÷ ${p.divisor}</div><div class="division"><div class="divisor">${p.divisor}</div><div class="qrow" style="grid-template-columns:repeat(${ds.length},1fr)">${ds.map((_,j)=>`<input class="qslot" maxlength="1" inputmode="numeric" data-slot="${j}">`).join('')}</div><div class="bracket"><div class="digits" style="grid-template-columns:repeat(${ds.length},1fr)">${ds.map(d=>`<span>${d}</span>`).join('')}</div><div class="workpad" contenteditable="true" spellcheck="false"></div></div></div></div><div class="steps">${['Divide','Multiply','Subtract','Bring down','Repeat / Stop'].map(x=>`<label class="step"><input type="checkbox"><span>${x}</span></label>`).join('')}</div><div class="feedback"></div><div class="footer"><div><strong>Check:</strong> divisor × answer + remainder = dividend</div><div class="answer"><span>Answer:</span><input class="finalq" inputmode="numeric"><span>R</span><input class="finalr" inputmode="numeric"></div></div>`;
    panels.appendChild(el)
  });
  wire()
}

function wire(){
  document.querySelectorAll('.qslot,.finalq,.finalr').forEach(inp=>inp.addEventListener('input',e=>{
    e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,e.target.classList.contains('qslot')?1:4);
    if(e.target.classList.contains('qslot')&&e.target.value){
      let n=e.target.closest('.qrow').querySelector(`[data-slot="${+e.target.dataset.slot+1}"]`);
      if(n)n.focus()
    }
  }))
}

function mark(){
  let c=0;
  document.querySelectorAll('.panel').forEach(panel=>{
    let p=problems[+panel.dataset.i],exQ=String(q(p.dividend,p.divisor)),exR=String(r(p.dividend,p.divisor)),exSlots=slots(p.dividend,p.divisor);
    let slotInputs=[...panel.querySelectorAll('.qslot')];
    let slotQ=slotInputs.map(x=>x.value).join('').replace(/^0+(?=\d)/,'');
    let fQ=panel.querySelector('.finalq').value.replace(/^0+(?=\d)/,''),fRraw=panel.querySelector('.finalr').value,fR=(fRraw||'0').replace(/^0+(?=\d)/,'');
    let givenQ=fQ||slotQ;
    let ok=givenQ===exQ&&fR===exR;
    slotInputs.forEach((x,j)=>{x.classList.remove('good','bad');if(x.value)x.classList.add(x.value===exSlots[j]?'good':'bad')});
    ['finalq','finalr'].forEach(cls=>panel.querySelector('.'+cls).classList.remove('good','bad'));
    if(fQ)panel.querySelector('.finalq').classList.add(givenQ===exQ?'good':'bad');
    if(fRraw||exR!=='0')panel.querySelector('.finalr').classList.add(fR===exR?'good':'bad');
    let fb=panel.querySelector('.feedback');
    fb.className='feedback show '+(ok?'ok':'no');
    fb.textContent=ok?'✅ Correct':'Check again: divisor × answer + remainder.';
    if(ok)c++
  });
  localStorage.setItem('longDivisionLastScore',c+'/6');
  status.textContent='Score: '+c+'/6 saved on this device.'
}

function clearWork(){
  document.querySelectorAll('input').forEach(x=>{if(x.type!=='checkbox')x.value='';else x.checked=false;x.classList.remove('good','bad')});
  document.querySelectorAll('.workpad').forEach(x=>x.textContent='');
  document.querySelectorAll('.feedback').forEach(x=>{x.className='feedback';x.textContent=''})
}

function newSet(){
  document.body.classList.remove('show-answers');
  $('#ansBtn').textContent='Show answers';
  setHeading();
  problems=build($('#set').value);
  render();
  const messages={classic:'Classic worksheet loaded.',balanced:'New balanced set generated.',easy:'New easier set generated.',challenge:'New challenge set generated.',challengeBlack:'Black challenge loaded.',challengePurple:'Purple challenge loaded.'};
  status.textContent=messages[$('#set').value]||'New set generated.'
}

$('#newBtn').onclick=newSet;
$('#markBtn').onclick=()=>{mark();$('#mode').value='practice'};
$('#ansBtn').onclick=()=>{document.body.classList.toggle('show-answers');$('#ansBtn').textContent=document.body.classList.contains('show-answers')?'Hide answers':'Show answers'};
$('#clearBtn').onclick=clearWork;
$('#printBtn').onclick=()=>{document.body.classList.remove('show-answers');$('#mode').value='print';setTimeout(()=>print(),100)};
$('#mode').onchange=e=>status.textContent=e.target.value==='teacher'?'Teacher board mode.':e.target.value==='practice'?'Student practice mode.':'Printable preview mode.';
$('#set').onchange=newSet;
newSet();
</script>
</body>
</html>

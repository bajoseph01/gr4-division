<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Division Web App v1.1</title>
<style>
:root{
  --ink:#0b0b0b;--paper:#fff;--bg:#f2f4f7;--muted:#667085;
  --green:#bfe6a8;--green2:#5a9d35;--orange:#ffd29b;--orange2:#e68a24;
  --red:#ff9d9d;--red2:#df4040;--blue:#2356b8;--softblue:#eef4ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button,select,input{font:inherit}
.app{max-width:1560px;margin:auto;padding:14px}
.toolbar{
  position:sticky;top:0;z-index:8;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;justify-content:center;background:rgba(255,255,255,.97);
  border:1px solid #d6dce3;border-radius:16px;padding:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.09);margin-bottom:12px
}
.toolbar label{font-weight:800;font-size:13px;color:#344054}
.toolbar select{height:36px;border:1px solid #cfd7df;border-radius:10px;background:white;padding:0 10px}
.btn{height:36px;border:0;border-radius:10px;padding:0 12px;font-weight:900;background:#111;color:#fff;cursor:pointer}
.btn.light{background:#fff;color:#111;border:1px solid #cfd7df}
.btn.blue{background:var(--blue)}.btn.green{background:#2f7d32}.btn.red{background:#b42323}
.status{font-size:13px;font-weight:800;color:#344054;min-width:230px;text-align:center}
.wrap{display:flex;justify-content:center}
#sheet{
  width:min(1488px,98vw);aspect-ratio:1.414/1;background:var(--paper);
  border:2px solid #111;box-shadow:0 18px 42px rgba(16,24,40,.18);
  padding:10px 16px 28px;overflow:hidden
}
.header{height:176px;position:relative;text-align:center}
.title{margin:0;font-size:clamp(42px,5.2vw,76px);font-weight:1000;line-height:.98;letter-spacing:.2px;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
.subtitle{margin-top:6px;font-size:clamp(19px,2.1vw,29px);font-weight:900}
.namebox{position:absolute;right:8px;top:38px;width:305px;text-align:left;font-size:18px;font-weight:900}
.linefield{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.linefield span:last-child{height:1.5px;background:#111;flex:1}
.tip{
  position:absolute;left:50%;top:116px;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:12px;border:2px solid #111;border-radius:12px;
  background:#fffef7;padding:10px 18px;font-size:clamp(16px,1.65vw,23px);
  font-weight:800;white-space:nowrap
}
.bulb{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff3a4;border:1px solid #d8bb43}
.panels{height:calc(100% - 176px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:22px}
.panel{
  position:relative;border:2px solid #111;border-radius:12px;background:#fff;padding:34px 12px 13px;
  display:grid;grid-template-columns:61% 39%;grid-template-rows:1fr auto;overflow:visible
}
.tab{position:absolute;top:-22px;left:24px;height:39px;min-width:198px;border-radius:8px;border:2px solid;padding:7px 18px 6px;font-size:18px;font-weight:900;text-align:center}
.green .tab{background:var(--green);border-color:var(--green2)}.orange .tab{background:var(--orange);border-color:var(--orange2)}.red .tab{background:var(--red);border-color:var(--red2)}
.problem{padding:0 12px 0 5px}.sum{font-size:32px;font-weight:900;text-align:center;margin:0 0 22px}
.division{display:grid;grid-template-columns:54px 1fr;grid-template-rows:34px auto;min-height:178px}
.divisor{grid-column:1;grid-row:2;padding-top:13px;text-align:right;padding-right:16px;font-size:31px;font-weight:900}
.qrow{grid-column:2;grid-row:1;display:grid;gap:8px;padding-left:18px;padding-right:20px}
.qslot{height:28px;border:0;border-bottom:3px solid #a2a2a2;text-align:center;font-size:25px;font-weight:900;background:transparent;outline:none}
.qslot.locked{border-bottom-color:transparent;color:transparent;pointer-events:none}
.qslot:focus{border-bottom-color:var(--blue);background:var(--softblue)}
.good{border-color:#2f7d32!important;background:#eefbea!important;color:#111!important}.bad{border-color:#c62828!important;background:#fff1f1!important;color:#111!important}
.bracket{grid-column:2;grid-row:2;min-height:166px;border-left:4px solid #111;border-top:4px solid #111;border-top-left-radius:13px;padding:10px 16px 10px 18px}
.digits{display:grid;gap:8px;font-size:31px;font-weight:900;text-align:center}
.workpad{margin-top:13px;min-height:78px;border:1px dashed #d0d5dd;border-radius:8px;padding:6px 8px;font-size:21px;line-height:1.35;white-space:pre-wrap;outline:none}
.workpad:focus{border-color:#b9c7d8;background:#fbfdff}
.steps{border-left:2px dashed #c9c9c9;padding-left:22px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.step{border:1px solid #d0d5dd;border-radius:9px;padding:7px 8px;background:#fff;font-size:14px;font-weight:800;line-height:1.18}
.step.current{border-color:var(--blue);background:#eef4ff}.step.revealed{border-color:#98a2b3;background:#f8fafc}
.step b{display:block;font-size:13px}.step span{display:block;color:#475467;font-weight:700;margin-top:2px}
.step .solution{display:none;color:#111;font-weight:900;margin-top:4px}.step.revealed .solution{display:block}
.footer{grid-column:1/3;border-top:2px solid #111;margin-top:6px;padding-top:8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:center;font-size:15px}
.footer strong{font-weight:900}.answer{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:13px;font-weight:900}
.answer input{width:48px;height:28px;border:1.6px solid #111;border-radius:6px;text-align:center;font-weight:900}
.feedback{position:absolute;left:16px;right:16px;bottom:44px;display:none;padding:5px 8px;border-radius:8px;font-size:13px;font-weight:900;text-align:center}
.feedback.show{display:block}.feedback.ok{background:#edf8ed;color:#236528;border:1px solid #9dcc9d}.feedback.no{background:#fff0f0;color:#a01818;border:1px solid #eeaaaa}
.badge{position:absolute;right:15px;top:11px;display:none;padding:5px 9px;border-radius:999px;background:#111;color:#fff;font-size:13px;font-weight:900}
body.show-answers .badge{display:block}.note{max-width:1488px;margin:10px auto 0;color:#475467;font-size:13px;text-align:center}
body.mode-practice #ansBtn,body.mode-practice #setWrap,body.mode-practice #newBtn,body.mode-practice #prevBtn,body.mode-practice #nextBtn,body.mode-practice #revealBtn{display:none}
body.mode-print .toolbar{position:relative}
body.mode-teacher .panels{grid-template-columns:1fr;grid-template-rows:1fr}
body.mode-teacher .panel{display:none}
body.mode-teacher .panel.focused{display:grid;grid-template-columns:60% 40%;padding:46px 26px 22px}
body.mode-teacher .panel.focused .sum{font-size:64px}
body.mode-teacher .panel.focused .divisor,body.mode-teacher .panel.focused .digits{font-size:58px}
body.mode-teacher .panel.focused .qslot{font-size:48px;height:48px}
body.mode-teacher .panel.focused .step{font-size:23px;padding:13px 14px}
body.mode-teacher .panel.focused .step b{font-size:23px}
body.mode-teacher .panel.focused .step span,body.mode-teacher .panel.focused .step .solution{font-size:20px}
body.mode-teacher .panel.focused .workpad{font-size:32px;min-height:130px}
@media(max-width:900px){.wrap{overflow:auto;justify-content:flex-start}#sheet{width:1200px;max-width:none}.toolbar{position:relative}.status{width:100%}}
@page{size:A4 landscape;margin:6mm}
@media print{
  body{background:white}.app{padding:0;max-width:none}.toolbar,.note,.answer,.feedback,.badge{display:none!important}
  #sheet{width:100%;height:auto;box-shadow:none;border:1.5px solid #111;padding:6px 10px 22px}
  .header{height:148px}.title{font-size:50px}.subtitle{font-size:20px}.tip{top:100px;font-size:16px;padding:7px 12px}.bulb{width:26px;height:26px}.namebox{font-size:15px;top:33px;width:260px}
  .panels{height:calc(100% - 148px);gap:15px;grid-template-columns:repeat(3,1fr)!important;grid-template-rows:repeat(2,1fr)!important}
  .panel{display:grid!important;padding:28px 10px 10px;grid-template-columns:61% 39%!important}.tab{top:-18px;height:32px;min-width:168px;font-size:14px;padding:6px 10px}
  .sum{font-size:24px!important;margin-bottom:16px}.divisor,.digits{font-size:25px!important}.qslot{font-size:1px!important;color:transparent!important;background:transparent!important;border-bottom:2px solid #999!important}
  .bracket{border-left-width:3px;border-top-width:3px;min-height:136px}.division{grid-template-columns:42px 1fr;min-height:145px}.workpad{min-height:72px}
  .steps{gap:6px;padding-left:14px;padding-top:8px}.step{font-size:11.5px;padding:5px 6px}.step b{font-size:11.5px}.step span,.step .solution{display:none!important}
  .footer{font-size:11.5px;padding-top:6px}
}
</style>
</head>
<body class="mode-teacher">
<div class="app">
  <div class="toolbar">
    <label>Mode <select id="mode"><option value="teacher">Teacher board</option><option value="practice">Student practice</option><option value="print">Printable preview</option></select></label>
    <label id="setWrap">Question set <select id="set"><option value="classic">Classic worksheet</option><option value="balanced">Balanced random</option><option value="easy">Easier</option><option value="challenge">Challenge</option></select></label>
    <button class="btn blue" id="newBtn">Generate set</button>
    <button class="btn light" id="prevBtn">◀ Previous</button>
    <button class="btn light" id="nextBtn">Next ▶</button>
    <button class="btn blue" id="revealBtn">Reveal next step</button>
    <button class="btn green" id="markBtn">Mark answers</button>
    <button class="btn light" id="ansBtn">Show answers</button>
    <button class="btn light" id="clearBtn">Clear work</button>
    <button class="btn red" id="printBtn">Print worksheet</button>
    <span class="status" id="status">Ready.</span>
  </div>
  <div class="wrap"><main id="sheet">
    <header class="header">
      <h1 class="title">Long Division Practice</h1>
      <div class="subtitle">Divide • Multiply • Subtract • Bring down • Repeat</div>
      <div class="namebox"><div class="linefield"><span>Name:</span><span></span></div><div class="linefield"><span>Date:</span><span></span></div></div>
      <div class="tip"><span class="bulb">💡</span><span>After you bring down, ask: Can I divide again?</span></div>
    </header>
    <section class="panels" id="panels"></section>
  </main></div>
  <div class="note">v1.1: real teacher focus mode, safer student mode, corrected quotient placement, revealable worked steps, printable worksheet view.</div>
</div>
<script>
const $ = s => document.querySelector(s);
const panels = $('#panels');
const status = $('#status');
let problems = [];
let focusIndex = 0;

const classic = [
  ['green','1. Green – Exact',48,2],
  ['orange','2. Orange – Exact',248,4],
  ['red','3. Red – Exact',864,4],
  ['green','4. Green – Remainder',85,4],
  ['orange','5. Orange – Remainder',137,5],
  ['red','6. Red – Remainder',529,7]
];

function quotient(a,b){return Math.floor(a/b)}
function remainder(a,b){return a%b}
function digits(n){return String(n).split('')}
function normalise(n){return String(n || '0').replace(/^0+(?=\d)/,'')}

function quotientCells(dividend, divisor){
  const ds = digits(dividend).map(Number);
  const cells = Array(ds.length).fill('');
  let carry = 0;
  let started = false;
  for(let i=0;i<ds.length;i++){
    const value = carry * 10 + ds[i];
    const qDigit = Math.floor(value / divisor);
    carry = value % divisor;
    if(qDigit > 0 || started || i === ds.length - 1){
      cells[i] = String(qDigit);
      started = true;
    }
  }
  return cells;
}

function workedSteps(dividend, divisor){
  const ds = digits(dividend).map(Number);
  let carry = 0, started = false, steps = [];
  for(let i=0;i<ds.length;i++){
    const value = carry * 10 + ds[i];
    const qDigit = Math.floor(value / divisor);
    const product = qDigit * divisor;
    const left = value - product;
    if(qDigit > 0 || started || i === ds.length - 1){
      const used = started ? value : Number(ds.slice(0,i+1).join(''));
      steps.push({
        label:'Divide',
        prompt:`Can ${divisor} go into ${used}?`,
        solution:`${used} ÷ ${divisor} = ${qDigit}`
      });
      steps.push({
        label:'Multiply',
        prompt:`Multiply the new top digit by ${divisor}.`,
        solution:`${qDigit} × ${divisor} = ${product}`
      });
      steps.push({
        label:'Subtract',
        prompt:'Subtract to find what is left.',
        solution:`${used} - ${product} = ${left}`
      });
      if(i < ds.length - 1){
        steps.push({
          label:'Bring down',
          prompt:`Bring down the next digit: ${ds[i+1]}.`,
          solution:`New number: ${left}${ds[i+1]}`
        });
      }else{
        steps.push({
          label:'Stop',
          prompt:'No more digits. Write the final answer.',
          solution:`Answer: ${quotient(dividend,divisor)}${remainder(dividend,divisor) ? ' R ' + remainder(dividend,divisor) : ''}`
        });
      }
      started = true;
    }
    carry = left;
  }
  return steps;
}

function makeProblem(level,label,exact){
  const divs = level === 'green' ? [2,3,4,5] : level === 'orange' ? [3,4,5,6,7] : [4,6,7,8,9];
  const d = divs[Math.floor(Math.random() * divs.length)];
  const min = level === 'green' ? 24 : level === 'orange' ? 110 : 300;
  const max = level === 'green' ? 99 : level === 'orange' ? 399 : 999;
  let n = 0, guard = 0;
  do{
    n = Math.floor(Math.random() * (max - min + 1)) + min;
    guard++;
  }while(((n % d === 0) !== exact || quotient(n,d) < 10) && guard < 500);
  return {level,label,dividend:n,divisor:d};
}

function build(kind){
  if(kind === 'classic') return classic.map(x => ({level:x[0],label:x[1],dividend:x[2],divisor:x[3]}));
  const easy = kind === 'easy';
  const challenge = kind === 'challenge';
  const specs = [
    ['green','1. Green – Exact',true],
    ['orange','2. Orange – Exact',true],
    ['red','3. Red – Exact',true],
    ['green','4. Green – Remainder',false],
    ['orange','5. Orange – Remainder',false],
    ['red','6. Red – Remainder',false]
  ];
  return specs.map(s => makeProblem(easy && s[0] === 'red' ? 'orange' : challenge && s[0] === 'green' ? 'orange' : s[0], s[1], s[2]));
}

function render(){
  panels.innerHTML = '';
  problems.forEach((p,i) => {
    const ds = digits(p.dividend);
    const ans = quotient(p.dividend,p.divisor);
    const rem = remainder(p.dividend,p.divisor);
    const qCells = quotientCells(p.dividend,p.divisor);
    const steps = workedSteps(p.dividend,p.divisor);
    const el = document.createElement('article');
    el.className = 'panel ' + p.level + (i === focusIndex ? ' focused' : '');
    el.dataset.i = i;
    el.innerHTML = `
      <div class="tab">${p.label}</div>
      <div class="badge">${ans}${rem ? ' R ' + rem : ''}</div>
      <div class="problem">
        <div class="sum">${p.dividend} ÷ ${p.divisor}</div>
        <div class="division">
          <div class="divisor">${p.divisor}</div>
          <div class="qrow" style="grid-template-columns:repeat(${ds.length},1fr)">
            ${qCells.map((v,j) => `<input class="qslot ${v ? '' : 'locked'}" maxlength="1" inputmode="numeric" data-slot="${j}" aria-label="Quotient digit ${j+1}">`).join('')}
          </div>
          <div class="bracket">
            <div class="digits" style="grid-template-columns:repeat(${ds.length},1fr)">${ds.map(d => `<span>${d}</span>`).join('')}</div>
            <div class="workpad" contenteditable="true" spellcheck="false" aria-label="Working space"></div>
          </div>
        </div>
      </div>
      <div class="steps">
        ${steps.slice(0,5).map((s,j) => `
          <div class="step ${j === 0 ? 'current' : ''}" data-step="${j}">
            <b>${j+1}. ${s.label}</b>
            <span>${s.prompt}</span>
            <div class="solution">${s.solution}</div>
          </div>`).join('')}
      </div>
      <div class="feedback"></div>
      <div class="footer">
        <div><strong>Check:</strong> divisor × answer + remainder = dividend</div>
        <div class="answer"><span>Answer:</span><input class="finalq" inputmode="numeric"><span>R</span><input class="finalr" inputmode="numeric"></div>
      </div>`;
    panels.appendChild(el);
  });
  wire();
  updateFocus();
}

function wire(){
  document.querySelectorAll('.qslot,.finalq,.finalr').forEach(inp => {
    inp.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/[^0-9]/g,'').slice(0, e.target.classList.contains('qslot') ? 1 : 4);
      if(e.target.classList.contains('qslot') && e.target.value){
        const slots = [...e.target.closest('.qrow').querySelectorAll('.qslot:not(.locked)')];
        const current = slots.indexOf(e.target);
        if(slots[current + 1]) slots[current + 1].focus();
      }
    });
  });
}

function mark(){
  let correct = 0;
  document.querySelectorAll('.panel').forEach(panel => {
    const p = problems[+panel.dataset.i];
    const exQ = String(quotient(p.dividend,p.divisor));
    const exR = String(remainder(p.dividend,p.divisor));
    const exSlots = quotientCells(p.dividend,p.divisor);
    const slotInputs = [...panel.querySelectorAll('.qslot')];
    const slotQ = slotInputs.map(x => x.classList.contains('locked') ? '' : x.value).join('').replace(/^0+(?=\d)/,'');
    const fQ = normalise(panel.querySelector('.finalq').value);
    const fRraw = panel.querySelector('.finalr').value;
    const fR = normalise(fRraw || '0');
    const givenQ = fQ !== '0' || panel.querySelector('.finalq').value ? fQ : slotQ;
    const ok = givenQ === exQ && fR === exR;

    slotInputs.forEach((x,j) => {
      x.classList.remove('good','bad');
      if(x.classList.contains('locked')) return;
      if(x.value) x.classList.add(x.value === exSlots[j] ? 'good' : 'bad');
    });

    ['finalq','finalr'].forEach(cls => panel.querySelector('.' + cls).classList.remove('good','bad'));
    if(panel.querySelector('.finalq').value) panel.querySelector('.finalq').classList.add(givenQ === exQ ? 'good' : 'bad');
    if(fRraw || exR !== '0') panel.querySelector('.finalr').classList.add(fR === exR ? 'good' : 'bad');

    const fb = panel.querySelector('.feedback');
    fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
    fb.textContent = ok ? '✓ Correct' : 'Check again: divisor × answer + remainder = dividend.';
    if(ok) correct++;
  });
  localStorage.setItem('longDivisionLastScore', correct + '/6');
  status.textContent = 'Score: ' + correct + '/6 saved on this device.';
}

function clearWork(){
  document.querySelectorAll('input').forEach(x => {
    if(x.type !== 'checkbox') x.value = '';
    x.classList.remove('good','bad');
  });
  document.querySelectorAll('.workpad').forEach(x => x.textContent = '');
  document.querySelectorAll('.feedback').forEach(x => {x.className = 'feedback'; x.textContent = ''});
  document.querySelectorAll('.step').forEach((x,i) => {
    x.classList.remove('revealed','current');
    if(i % 5 === 0) x.classList.add('current');
  });
  status.textContent = 'Work cleared.';
}

function updateMode(){
  document.body.classList.remove('mode-teacher','mode-practice','mode-print');
  document.body.classList.add('mode-' + $('#mode').value);
  document.body.classList.remove('show-answers');
  $('#ansBtn').textContent = 'Show answers';
  updateFocus();
  status.textContent = $('#mode').value === 'teacher' ? 'Teacher board mode: focus one sum and reveal steps.' : $('#mode').value === 'practice' ? 'Student practice mode: answers hidden.' : 'Printable preview mode.';
}

function updateFocus(){
  document.querySelectorAll('.panel').forEach((panel,i) => panel.classList.toggle('focused', i === focusIndex));
  $('#prevBtn').disabled = focusIndex === 0;
  $('#nextBtn').disabled = focusIndex === problems.length - 1;
  if($('#mode').value === 'teacher') status.textContent = 'Teacher board: problem ' + (focusIndex + 1) + ' of ' + problems.length + '.';
}

function revealNextStep(){
  const panel = document.querySelector('.panel.focused');
  if(!panel) return;
  const steps = [...panel.querySelectorAll('.step')];
  const next = steps.find(s => !s.classList.contains('revealed'));
  if(next){
    steps.forEach(s => s.classList.remove('current'));
    next.classList.add('revealed');
    const nextIndex = steps.indexOf(next) + 1;
    if(steps[nextIndex]) steps[nextIndex].classList.add('current');
    status.textContent = 'Revealed step ' + (nextIndex) + '.';
  }else{
    status.textContent = 'All visible steps revealed for this problem.';
  }
}

function newSet(){
  document.body.classList.remove('show-answers');
  $('#ansBtn').textContent = 'Show answers';
  focusIndex = 0;
  problems = build($('#set').value);
  render();
  updateMode();
  status.textContent = $('#set').value === 'classic' ? 'Classic worksheet loaded.' : 'New set generated.';
}

$('#newBtn').onclick = newSet;
$('#markBtn').onclick = () => { mark(); if($('#mode').value !== 'teacher') $('#mode').value = 'practice'; updateMode(); };
$('#ansBtn').onclick = () => {
  document.body.classList.toggle('show-answers');
  $('#ansBtn').textContent = document.body.classList.contains('show-answers') ? 'Hide answers' : 'Show answers';
};
$('#clearBtn').onclick = clearWork;
$('#printBtn').onclick = () => { document.body.classList.remove('show-answers'); $('#mode').value='print'; updateMode(); setTimeout(() => print(),100); };
$('#mode').onchange = updateMode;
$('#prevBtn').onclick = () => { if(focusIndex > 0) focusIndex--; updateFocus(); };
$('#nextBtn').onclick = () => { if(focusIndex < problems.length - 1) focusIndex++; updateFocus(); };
$('#revealBtn').onclick = revealNextStep;

newSet();
</script>
</body>
</html>

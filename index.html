<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gr4 Division</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gr4 Division">
  <meta name="theme-color" content="#2f7d4f">
  <style>
    :root {
      --green: #2f7d4f;
      --green-dark: #23623d;
      --yellow: #ffd166;
      --blue: #d8ecff;
      --red: #d94f45;
      --ink: #252525;
      --muted: #667085;
      --paper: #fffdf7;
      --line: #ded6c8;
      --soft: #f4efe4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overscroll-behavior-y: contain;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--soft);
      padding: 16px;
    }

    .app {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin: 8px 0 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.25rem);
      letter-spacing: 0;
    }

    .brand span { color: #d99018; }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .shell {
      display: block;
    }

    .panel, .scratchpad {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }

    .panel { padding: 14px; }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }

    .quiet-button {
      background: #ece8de;
      color: #38423b;
      min-height: 38px;
      padding: 8px 12px;
    }

    .teacher-drawer {
      border: 1px solid #e4ddd0;
      border-radius: 8px;
      background: #fbfaf6;
      padding: 12px;
      margin-bottom: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tab-button, button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      background: #e8ece9;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
    }

    .tab-button.active, .primary {
      background: var(--green);
      color: white;
    }

    button:hover { filter: brightness(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    input[type="text"], input[type="number"] {
      border: 1px solid #c9c9c9;
      border-radius: 6px;
      min-height: 42px;
      padding: 9px 10px;
      font-size: 1rem;
      background: white;
    }

    .sample-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 0;
    }

    .sample-row button, .secondary {
      background: #f0f2f4;
      color: #263238;
    }

    .sample-bank {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .sample-band {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      align-items: center;
    }

    .sample-label {
      color: #475467;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .sample-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sample-buttons button {
      min-width: 72px;
      min-height: 44px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05);
    }

    .difficulty-1 { background: #dcfce7; color: #143d25; }
    .difficulty-2 { background: #bbf7d0; color: #143d25; }
    .difficulty-3 { background: #fef3c7; color: #3f3208; }
    .difficulty-4 { background: #fed7aa; color: #4a2505; }
    .difficulty-5 { background: #fecaca; color: #5f1515; }
    .difficulty-6 { background: #dc2626; color: white; }

    .mode-note {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .work-area {
      background: var(--paper);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: clamp(14px, 3vw, 28px);
      min-height: 520px;
      overflow-x: auto;
    }

    .long-work-area {
      display: grid;
      grid-template-columns: minmax(320px, 0.95fr) minmax(300px, 1.05fr);
      gap: clamp(16px, 3vw, 30px);
      align-items: start;
      overflow: visible;
    }

    #longBoard {
      position: sticky;
      top: 10px;
      align-self: start;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    #longStepArea {
      align-self: start;
    }

    #longFeedback {
      grid-column: 2;
    }

    .division-board {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      align-items: start;
      gap: 0;
      font-family: "Courier New", monospace;
      font-size: clamp(2.5rem, 7vw, 5rem);
      margin: 8px auto 28px;
      width: max-content;
      max-width: 100%;
      --quotient-height: clamp(66px, 10vw, 96px);
    }

    .long-work-area .division-board {
      font-size: clamp(2.1rem, 4.8vw, 4.4rem);
      margin-top: 0;
    }

    .divisor {
      padding: 0 8px 9px 0;
      line-height: 1;
    }

    .division-board > .divisor {
      margin-top: calc(var(--quotient-height) + clamp(26px, 4vw, 40px));
      padding: 0 8px 0 0;
    }

    .house {
      min-width: 180px;
      --cell-size: clamp(44px, 7vw, 64px);
      --cell-gap: 12px;
      --house-pad: 13px;
    }

    .long-work-area .house {
      --cell-size: clamp(40px, 5.5vw, 58px);
    }

    .quotient-line {
      min-height: var(--quotient-height);
      border-bottom: 3px solid #111;
      padding-left: var(--house-pad);
      display: grid;
      grid-template-columns: repeat(var(--digit-count), var(--cell-size));
      justify-content: center;
      gap: var(--cell-gap);
      align-items: end;
    }

    .dividend-line {
      border-left: 3px solid #111;
      padding: 8px 10px 0 var(--house-pad);
      display: flex;
      gap: var(--cell-gap);
      justify-content: center;
      min-height: clamp(70px, 10vw, 100px);
    }

    .digit-wrap {
      display: grid;
      gap: 2px;
      justify-items: center;
      min-width: 32px;
    }

    .place-label {
      font-size: 0.8rem;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--muted);
      line-height: 1;
    }

    .current-digit {
      background: var(--yellow);
      border-radius: 6px;
      padding: 0 5px;
    }

    .q-box {
      width: clamp(44px, 7vw, 64px);
      height: clamp(50px, 7vw, 70px);
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: clamp(2rem, 5vw, 3.2rem);
      padding: 0;
      border-color: #7fb3e8;
      background: var(--blue);
    }

    .board-value {
      display: inline-grid;
      place-items: center;
      width: var(--cell-size);
      height: clamp(50px, 7vw, 70px);
      color: #111;
    }

    .board-value.empty {
      color: transparent;
    }

    .formal-work {
      border-left: 3px solid transparent;
      padding-left: calc(var(--house-pad) + clamp(22px, 4vw, 34px));
      padding-right: 10px;
      margin-top: -8px;
      font-size: clamp(2rem, 5.5vw, 4rem);
    }

    .work-number-row {
      display: grid;
      grid-template-columns: repeat(var(--digit-count), var(--cell-size));
      gap: var(--cell-gap);
      justify-content: center;
      min-height: clamp(44px, 6vw, 62px);
      align-items: center;
      position: relative;
    }

    .work-number-row.has-minus::before {
      content: "-";
      position: absolute;
      left: calc(-0.62 * var(--cell-size));
      top: 50%;
      transform: translateY(-52%);
      color: #111;
      font-size: 0.85em;
      font-weight: 800;
    }

    .work-cell {
      display: grid;
      place-items: center;
      min-width: 0;
      line-height: 1;
    }

    .work-cell.blank {
      color: transparent;
    }

    .work-cell.placeholder-dot {
      color: #6b7280;
      font-size: 0.7em;
      align-self: end;
      padding-bottom: 0.12em;
    }

    .work-cell.brought-down {
      color: #111;
      font-weight: 700;
      position: relative;
    }

    .work-cell.brought-down::before {
      content: "↓";
      position: absolute;
      top: -1.08em;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(47, 125, 79, 0.6);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72em;
      font-weight: 900;
      line-height: 1;
    }

    .work-rule {
      height: 3px;
      background: #111;
      margin: 2px 0 5px;
      justify-self: stretch;
    }

    .work-rule.start {
      margin-left: 0;
    }

    .work-rule.middle {
      margin-left: calc(-1 * var(--cell-gap));
    }

    .work-rule.end {
      margin-left: calc(-1 * var(--cell-gap));
    }

    .working-lines {
      width: 100%;
      max-height: 190px;
      overflow-y: auto;
      margin: 0 0 12px;
      color: #3a3a3a;
      background: rgba(255,255,255,0.7);
      border: 1px solid #ebe3d5;
      border-radius: 8px;
      font-size: clamp(0.95rem, 1.7vw, 1.2rem);
      line-height: 1.5;
    }

    .working-lines div {
      border-bottom: 1px solid #ebe3d5;
      padding: 5px 10px;
    }

    .working-lines div:last-child {
      border-bottom: 0;
    }

    .step-card {
      background: white;
      border: 1px solid #e5dfd0;
      border-radius: 8px;
      padding: clamp(14px, 3vw, 24px);
      margin: 0 auto;
      width: min(620px, 100%);
      text-align: center;
    }

    .step-card.active {
      border-color: var(--green);
      box-shadow: inset 4px 0 0 var(--green);
    }

    .step-title {
      margin: 0 0 14px;
      font-size: clamp(1.35rem, 3vw, 2.1rem);
      font-weight: 700;
    }

    .step-prompt {
      margin: 0 0 16px;
      color: #344054;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    }

    .step-grid {
      display: block;
      width: min(260px, 100%);
      margin: 0 auto;
    }

    .field label {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: #475467;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      min-height: 58px;
    }

    .step-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .feedback {
      min-height: 28px;
      margin-top: 14px;
      font-weight: 700;
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .feedback.good { color: var(--green-dark); }
    .feedback.bad { color: var(--red); }

    .short-grid {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      font-family: "Courier New", monospace;
      font-size: clamp(1.8rem, 5vw, 3rem);
      margin: 8px 0 18px;
    }

    .short-house {
      display: grid;
      grid-template-rows: auto auto;
    }

    .short-quotient {
      border-bottom: 3px solid #111;
      border-left: 3px solid transparent;
      padding-left: 12px;
      display: flex;
      gap: 8px;
      min-height: 54px;
      align-items: end;
    }

    .short-dividend {
      border-left: 3px solid #111;
      padding: 8px 10px 0 12px;
      display: flex;
      gap: 8px;
    }

    .short-digit {
      position: relative;
      min-width: 38px;
      text-align: center;
    }

    .carry {
      position: absolute;
      top: -22px;
      left: -8px;
      width: 34px;
      min-height: 30px;
      padding: 0;
      text-align: center;
      color: #b42318;
      background: #fff0f0;
      font-size: 1rem;
      font-weight: 700;
    }

    .scratchpad {
      padding: 12px;
      margin-top: 12px;
    }

    .scratchpad h2 {
      font-size: 1.05rem;
      margin: 0 0 8px;
      text-align: center;
    }

    .tools {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }

    .tools button {
      min-height: 36px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    canvas {
      width: 100%;
      height: 300px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: white;
      touch-action: none;
      cursor: crosshair;
    }

    .hidden { display: none; }

    @media (max-width: 850px) {
      body { padding: 10px; }
      .long-work-area {
        grid-template-columns: 1fr;
        overflow-x: auto;
      }
      #longBoard {
        position: static;
      }
      #longFeedback {
        grid-column: 1;
      }
      .controls { grid-template-columns: 1fr 1fr; }
      .controls input { grid-column: 1 / -1; }
      canvas { height: 320px; }
    }

    @media (max-width: 520px) {
      .panel { padding: 12px; }
      .controls { grid-template-columns: 1fr; }
      .sample-row button, .controls button { width: 100%; }
      .sample-band {
        grid-template-columns: 1fr;
      }
      .sample-buttons button {
        min-width: 0;
        flex: 1 1 84px;
      }
      .q-box { width: 38px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <h1>Jo<span>Go</span> Gr4 Division</h1>
      <p>Long division first. Short division after the method makes sense.</p>
    </header>

    <section class="shell">
      <div class="panel">
        <div class="top-actions">
          <button class="quiet-button" type="button" onclick="toggleTeacherDrawer()">SETUP</button>
          <button class="quiet-button" type="button" onclick="toggleScratchpad()">Scratchpad</button>
        </div>

        <div id="teacherDrawer" class="teacher-drawer hidden">
          <nav class="tabs" aria-label="Division modes">
            <button class="tab-button active" id="longTab" type="button" onclick="switchTab('long')">Long Division</button>
            <button class="tab-button" id="shortTab" type="button" onclick="switchTab('short')">Short Division</button>
          </nav>

          <div id="longTeacherControls">
            <div class="controls">
              <input id="longEquation" type="text" value="84 / 4" aria-label="Long division problem" onkeydown="handleSetupKey(event, 'long')">
              <button class="primary" type="button" onclick="setupLongDivision()">Set Up</button>
              <button class="secondary" type="button" onclick="resetLongWork()">Reset</button>
              <button class="secondary" type="button" onclick="revealLongStep()">Reveal</button>
            </div>
            <div class="sample-bank" aria-label="Long division sample problems">
              <div class="sample-band">
                <div class="sample-label">2 digit exact</div>
                <div class="sample-buttons">
                  <button class="difficulty-1" type="button" onclick="setLongSample('48 / 2')">48 / 2</button>
                  <button class="difficulty-1" type="button" onclick="setLongSample('84 / 4')">84 / 4</button>
                  <button class="difficulty-1" type="button" onclick="setLongSample('96 / 3')">96 / 3</button>
                  <button class="difficulty-2" type="button" onclick="setLongSample('75 / 5')">75 / 5</button>
                  <button class="difficulty-2" type="button" onclick="setLongSample('72 / 6')">72 / 6</button>
                </div>
              </div>
              <div class="sample-band">
                <div class="sample-label">3 digit exact</div>
                <div class="sample-buttons">
                  <button class="difficulty-2" type="button" onclick="setLongSample('132 / 6')">132 / 6</button>
                  <button class="difficulty-2" type="button" onclick="setLongSample('156 / 3')">156 / 3</button>
                  <button class="difficulty-3" type="button" onclick="setLongSample('248 / 4')">248 / 4</button>
                  <button class="difficulty-3" type="button" onclick="setLongSample('426 / 3')">426 / 3</button>
                  <button class="difficulty-3" type="button" onclick="setLongSample('864 / 4')">864 / 4</button>
                </div>
              </div>
              <div class="sample-band">
                <div class="sample-label">2 digit rem.</div>
                <div class="sample-buttons">
                  <button class="difficulty-4" type="button" onclick="setLongSample('85 / 4')">85 / 4</button>
                  <button class="difficulty-4" type="button" onclick="setLongSample('74 / 3')">74 / 3</button>
                  <button class="difficulty-4" type="button" onclick="setLongSample('59 / 5')">59 / 5</button>
                  <button class="difficulty-5" type="button" onclick="setLongSample('97 / 6')">97 / 6</button>
                  <button class="difficulty-5" type="button" onclick="setLongSample('79 / 4')">79 / 4</button>
                </div>
              </div>
              <div class="sample-band">
                <div class="sample-label">3 digit rem.</div>
                <div class="sample-buttons">
                  <button class="difficulty-5" type="button" onclick="setLongSample('137 / 5')">137 / 5</button>
                  <button class="difficulty-5" type="button" onclick="setLongSample('258 / 4')">258 / 4</button>
                  <button class="difficulty-5" type="button" onclick="setLongSample('347 / 6')">347 / 6</button>
                  <button class="difficulty-6" type="button" onclick="setLongSample('529 / 7')">529 / 7</button>
                  <button class="difficulty-6" type="button" onclick="setLongSample('746 / 9')">746 / 9</button>
                </div>
              </div>
            </div>
          </div>

          <div id="shortTeacherControls" class="hidden">
            <div class="controls">
              <input id="shortEquation" type="text" value="852 / 8" aria-label="Short division problem" onkeydown="handleSetupKey(event, 'short')">
              <button class="primary" type="button" onclick="setupShortDivision()">Set Up</button>
              <button class="secondary" type="button" onclick="checkShortDivision()">Check</button>
              <button class="secondary" type="button" onclick="revealShortDivision()">Reveal</button>
            </div>
            <div class="sample-row" aria-label="Short division sample problems">
              <button type="button" onclick="setShortSample('246 / 2')">246 / 2</button>
              <button type="button" onclick="setShortSample('852 / 8')">852 / 8</button>
              <button type="button" onclick="setShortSample('936 / 3')">936 / 3</button>
              <button type="button" onclick="setShortSample('725 / 6')">725 / 6</button>
            </div>
          </div>
        </div>

        <section id="longPanel">
          <div class="work-area long-work-area">
            <div id="longBoard"></div>
            <div id="longStepArea"></div>
            <div id="longFeedback" class="feedback" aria-live="polite"></div>
          </div>
        </section>

        <section id="shortPanel" class="hidden">
          <div class="work-area">
            <div id="shortBoard"></div>
            <div id="shortFeedback" class="feedback" aria-live="polite"></div>
          </div>
        </section>
      </div>

      <aside id="scratchpadPanel" class="scratchpad hidden">
        <h2>Scratchpad</h2>
        <div class="tools">
          <button id="pencilBtn" class="primary" type="button" onclick="setTool('pencil')">Pencil</button>
          <button id="eraserBtn" type="button" onclick="setTool('eraser')">Eraser</button>
          <button type="button" onclick="undoCanvas()">Undo</button>
          <button type="button" onclick="redoCanvas()">Redo</button>
          <button type="button" onclick="clearCanvas()">Clear</button>
        </div>
        <canvas id="scratchCanvas" width="320" height="430"></canvas>
      </aside>
    </section>
  </main>

  <script>
    let currentTab = "long";
    let longProblem = null;
    let longStepIndex = 0;
    let longPartIndex = 0;
    let longReadyForNext = false;
    let shortProblem = null;
    let canvas;
    let ctx;
    let drawing = false;
    let tool = "pencil";
    let history = [];
    let historyIndex = -1;

    function parseEquation(value) {
      const parts = value.split("/").map(part => part.trim());
      if (parts.length !== 2) return { error: "Use this format: 84 / 4" };
      const dividend = Number(parts[0]);
      const divisor = Number(parts[1]);
      if (!Number.isInteger(dividend) || !Number.isInteger(divisor)) return { error: "Use whole numbers only." };
      if (dividend < 0 || divisor <= 0) return { error: "The dividend must be 0 or more, and the divisor must be bigger than 0." };
      if (divisor > 12) return { error: "For Grade 4 practice, keep the divisor 12 or less." };
      return { dividend, divisor };
    }

    function toggleTeacherDrawer() {
      document.getElementById("teacherDrawer").classList.toggle("hidden");
    }

    function toggleScratchpad() {
      const panel = document.getElementById("scratchpadPanel");
      panel.classList.toggle("hidden");
      if (!panel.classList.contains("hidden")) resizeCanvasForDisplay();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("longPanel").classList.toggle("hidden", tab !== "long");
      document.getElementById("shortPanel").classList.toggle("hidden", tab !== "short");
      document.getElementById("longTeacherControls").classList.toggle("hidden", tab !== "long");
      document.getElementById("shortTeacherControls").classList.toggle("hidden", tab !== "short");
      document.getElementById("longTab").classList.toggle("active", tab === "long");
      document.getElementById("shortTab").classList.toggle("active", tab === "short");
    }

    function setLongSample(problem) {
      document.getElementById("longEquation").value = problem;
      setupLongDivision();
    }

    function setShortSample(problem) {
      document.getElementById("shortEquation").value = problem;
      setupShortDivision();
    }

    function handleSetupKey(event, mode) {
      if (event.key !== "Enter") return;
      event.preventDefault();
      if (mode === "long") setupLongDivision();
      else setupShortDivision();
    }

    function placeLabel(index, length) {
      const labels = ["ones", "tens", "hundreds", "thousands", "ten thousands"];
      return labels[length - index - 1] || "";
    }

    function buildLongSteps(dividend, divisor) {
      const digits = String(dividend).split("").map(Number);
      const steps = [];
      let partial = 0;
      let startIndex = 0;

      digits.forEach((digit, index) => {
        partial = partial * 10 + digit;
        const isLast = index === digits.length - 1;
        if (partial >= divisor || isLast) {
          const qDigit = Math.floor(partial / divisor);
          const product = qDigit * divisor;
          const remainder = partial - product;
          steps.push({
            startIndex,
            endIndex: index,
            partial,
            qDigit,
            product,
            remainder,
            bringDown: isLast ? "" : String(digits[index + 1])
          });
          partial = remainder;
          startIndex = index + 1;
        }
      });

      return steps;
    }

    function setupLongDivision() {
      const parsed = parseEquation(document.getElementById("longEquation").value);
      const feedback = document.getElementById("longFeedback");
      feedback.textContent = "";
      feedback.className = "feedback";

      if (parsed.error) {
        document.getElementById("longBoard").innerHTML = "";
        document.getElementById("longStepArea").innerHTML = "";
        feedback.textContent = parsed.error;
        feedback.classList.add("bad");
        return;
      }

      longProblem = {
        dividend: parsed.dividend,
        divisor: parsed.divisor,
        steps: buildLongSteps(parsed.dividend, parsed.divisor)
      };
      longStepIndex = 0;
      longPartIndex = 0;
      longReadyForNext = false;
      renderLongDivision();
    }

    function resetLongWork() {
      if (!longProblem) return setupLongDivision();
      longStepIndex = 0;
      longPartIndex = 0;
      longReadyForNext = false;
      renderLongDivision();
    }

    function longPartsForStep(step) {
      return step.bringDown === "" ? ["divide", "multiply", "subtract"] : ["divide", "multiply", "subtract", "bring"];
    }

    function currentLongPart() {
      const step = longProblem.steps[longStepIndex];
      if (!step) return null;
      return longPartsForStep(step)[longPartIndex];
    }

    function longPartDetails(step, part) {
      const details = {
        divide: {
          title: "Divide",
          prompt: `How many ${longProblem.divisor}s fit into ${step.partial}?`,
          label: "Quotient digit",
          answer: String(step.qDigit)
        },
        multiply: {
          title: "Multiply",
          prompt: `${longProblem.divisor} x ${step.qDigit} = ?`,
          label: "Product",
          answer: String(step.product)
        },
        subtract: {
          title: "Subtract",
          prompt: `${step.partial} - ${step.product} = ?`,
          label: "Remainder",
          answer: String(step.remainder)
        },
        bring: {
          title: "Bring Down",
          prompt: "Which digit comes down next?",
          label: "Next digit",
          answer: step.bringDown
        }
      };
      return details[part];
    }

    function longStepLine(step, part) {
      const lines = {
        divide: `${longProblem.divisor} into ${step.partial} = ${step.qDigit}`,
        multiply: `${longProblem.divisor} x ${step.qDigit} = ${step.product}`,
        subtract: `${step.partial} - ${step.product} = ${step.remainder === 0 ? "." : step.remainder}`,
        bring: `Bring down ${step.bringDown}`
      };
      return lines[part];
    }

    function renderWorkingLines() {
      const lines = [];
      longProblem.steps.forEach((step, stepIndex) => {
        const parts = longPartsForStep(step);
        let visibleCount = 0;
        if (stepIndex < longStepIndex) visibleCount = parts.length;
        if (stepIndex === longStepIndex) visibleCount = longPartIndex + (longReadyForNext ? 1 : 0);
        parts.slice(0, visibleCount).forEach(part => lines.push(longStepLine(step, part)));
      });
      return lines.length ? `<div class="working-lines">${lines.map(line => `<div>${line}</div>`).join("")}</div>` : "";
    }

    function isLongPartVisible(stepIndex, partName) {
      const step = longProblem.steps[stepIndex];
      const parts = longPartsForStep(step);
      let visibleCount = 0;
      if (stepIndex < longStepIndex) visibleCount = parts.length;
      if (stepIndex === longStepIndex) visibleCount = longPartIndex + (longReadyForNext ? 1 : 0);
      return parts.slice(0, visibleCount).includes(partName);
    }

    function digitCellsForValue(value, startIndex, endIndex, totalDigits) {
      const cells = Array(totalDigits).fill("");
      const digits = String(value).split("");
      const firstColumn = Math.max(0, endIndex - digits.length + 1);
      digits.forEach((digit, offset) => {
        const column = firstColumn + offset;
        if (column >= 0 && column < totalDigits && digit !== " ") cells[column] = digit;
      });
      return cells;
    }

    function firstColumnForValue(value, endIndex) {
      return Math.max(0, endIndex - String(value).length + 1);
    }

    function renderNumberRow(cells, extra = "") {
      return `<div class="work-number-row" ${extra}>${cells.map(cell => {
        const value = typeof cell === "object" ? cell.value : cell;
        const className = typeof cell === "object" ? cell.className : "";
        return `<span class="work-cell ${value === "" ? "blank" : ""} ${className}">${value || "0"}</span>`;
      }).join("")}</div>`;
    }

    function renderRuleRow(startIndex, endIndex, totalDigits) {
      const cells = Array(totalDigits).fill("");
      for (let index = startIndex; index <= endIndex; index += 1) {
        let position = "middle";
        if (index === startIndex) position = "start";
        if (index === endIndex) position = index === startIndex ? "single" : "end";
        cells[index] = `<span class="work-rule ${position}"></span>`;
      }
      return `<div class="work-number-row">${cells.map(cell => cell || `<span class="work-cell blank">0</span>`).join("")}</div>`;
    }

    function remainderCell(value) {
      return value === 0 ? { value: ".", className: "placeholder-dot" } : String(value);
    }

    function remainderCellsForStep(step, totalDigits) {
      const cells = Array(totalDigits).fill("");
      if (step.remainder === 0) {
        const firstColumn = firstColumnForValue(step.partial, step.endIndex);
        for (let index = firstColumn; index <= step.endIndex; index += 1) {
          cells[index] = { value: ".", className: "placeholder-dot" };
        }
        return cells;
      }

      return digitCellsForValue(step.remainder, step.startIndex, step.endIndex, totalDigits);
    }

    function renderFormalWork(totalDigits) {
      const rows = [];

      longProblem.steps.forEach((step, stepIndex) => {
        if (isLongPartVisible(stepIndex, "multiply")) {
          rows.push(renderNumberRow(digitCellsForValue(step.product, step.startIndex, step.endIndex, totalDigits), 'class="has-minus"'));
          const ruleStart = Math.min(
            firstColumnForValue(step.partial, step.endIndex),
            firstColumnForValue(step.product, step.endIndex)
          );
          rows.push(renderRuleRow(ruleStart, step.endIndex, totalDigits));
        }

        if (isLongPartVisible(stepIndex, "subtract")) {
          const remainderCells = remainderCellsForStep(step, totalDigits);
          if (isLongPartVisible(stepIndex, "bring") && step.bringDown !== "") {
            remainderCells[step.endIndex + 1] = { value: step.bringDown, className: "brought-down" };
          }
          rows.push(renderNumberRow(remainderCells));
        }
      });

      return `<div class="formal-work" style="--digit-count:${totalDigits};">${rows.join("")}</div>`;
    }

    function renderLongDivision() {
      const board = document.getElementById("longBoard");
      const stepArea = document.getElementById("longStepArea");
      const digits = String(longProblem.dividend).split("");
      const quotientCells = Array(digits.length).fill("");
      longProblem.steps.forEach((step, index) => {
        if (index < longStepIndex || (index === longStepIndex && (longPartIndex > 0 || (longReadyForNext && currentLongPart() === "divide")))) {
          quotientCells[step.endIndex] = String(step.qDigit);
        }
      });
      const active = longProblem.steps[longStepIndex];

      board.innerHTML = `
        <div class="division-board">
          <div class="divisor">${longProblem.divisor}</div>
          <div class="house">
            <div class="quotient-line" style="--digit-count:${digits.length};">
              ${quotientCells.map((digit, index) => `<span class="board-value ${digit === "" ? "empty" : ""}" id="q-${index}">${digit || "0"}</span>`).join("")}
            </div>
            <div class="dividend-line">
              ${digits.map((digit, index) => `
                <div class="digit-wrap">
                  <span class="place-label">${placeLabel(index, digits.length)}</span>
                  <span class="${active && index >= active.startIndex && index <= active.endIndex ? "current-digit" : ""}">${digit}</span>
                </div>
              `).join("")}
            </div>
            ${renderFormalWork(digits.length)}
          </div>
        </div>
      `;

      if (!active) {
        const q = Math.floor(longProblem.dividend / longProblem.divisor);
        const r = longProblem.dividend % longProblem.divisor;
        stepArea.innerHTML = `
          ${renderWorkingLines()}
          <div class="step-card active"><p class="step-title">Complete: ${longProblem.dividend} / ${longProblem.divisor} = ${q}${r ? " rem. " + r : ""}</p></div>
        `;
        return;
      }

      const part = currentLongPart();
      const detail = longPartDetails(active, part);
      const buttonText = longReadyForNext ? "Next" : "Check";
      stepArea.innerHTML = `
        ${renderWorkingLines()}
        <div class="step-card active">
          <p class="step-title">${detail.title}</p>
          <p class="step-prompt">${detail.prompt}</p>
          <div class="step-grid">
            <div class="field">
              <label for="longAnswer">${detail.label}</label>
              <input id="longAnswer" inputmode="numeric" value="${longReadyForNext ? detail.answer : ""}" onkeydown="handleLongAnswerKey(event)" ${longReadyForNext ? "disabled" : ""}>
            </div>
          </div>
          <div class="step-actions">
            <button class="primary" id="longMainButton" type="button" onclick="handleLongMainAction()">${buttonText}</button>
          </div>
        </div>
      `;
      if (longReadyForNext) document.getElementById("longMainButton").focus();
      else document.getElementById("longAnswer").focus();
    }

    function handleLongMainAction() {
      if (longReadyForNext) advanceLongPart();
      else checkLongStep();
    }

    function handleLongAnswerKey(event) {
      if (event.key !== "Enter") return;
      event.preventDefault();
      handleLongMainAction();
    }

    function checkLongStep() {
      const active = longProblem.steps[longStepIndex];
      const feedback = document.getElementById("longFeedback");
      const part = currentLongPart();
      const detail = longPartDetails(active, part);
      const answer = document.getElementById("longAnswer").value.trim();
      feedback.className = "feedback";

      if (answer !== detail.answer) {
        const hints = {
          divide: `Think: how many ${longProblem.divisor}s can fit without going over ${active.partial}?`,
          multiply: "Use the quotient digit you just found.",
          subtract: "Subtract the product from the number you divided.",
          bring: "Look at the next digit in the dividend."
        };
        feedback.textContent = hints[part];
        feedback.classList.add("bad");
        return;
      }

      longReadyForNext = true;
      feedback.textContent = "Good.";
      feedback.classList.add("good");
      renderLongDivision();
    }

    function revealLongStep() {
      if (!longProblem) return setupLongDivision();
      const active = longProblem.steps[longStepIndex];
      if (!active) return;
      const detail = longPartDetails(active, currentLongPart());
      document.getElementById("longAnswer").value = detail.answer;
      longReadyForNext = true;
      const feedback = document.getElementById("longFeedback");
      feedback.textContent = "Revealed.";
      feedback.className = "feedback good";
      renderLongDivision();
    }

    function advanceLongPart() {
      if (!longProblem) return;
      const parts = longPartsForStep(longProblem.steps[longStepIndex]);
      if (longPartIndex < parts.length - 1) {
        longPartIndex += 1;
      } else {
        longStepIndex += 1;
        longPartIndex = 0;
      }
      longReadyForNext = false;
      document.getElementById("longFeedback").textContent = "";
      renderLongDivision();
    }

    function nextLongStep() {
      advanceLongPart();
    }

    function setupShortDivision() {
      const parsed = parseEquation(document.getElementById("shortEquation").value);
      const board = document.getElementById("shortBoard");
      const feedback = document.getElementById("shortFeedback");
      feedback.textContent = "";
      feedback.className = "feedback";

      if (parsed.error) {
        board.innerHTML = "";
        feedback.textContent = parsed.error;
        feedback.classList.add("bad");
        return;
      }

      shortProblem = parsed;
      const digits = String(parsed.dividend).split("");
      board.innerHTML = `
        <div class="short-grid">
          <div class="divisor">${parsed.divisor}</div>
          <div class="short-house">
            <div class="short-quotient" id="shortQuotient">
              ${digits.map((_, index) => `<input class="q-box" id="sq-${index}" inputmode="numeric" maxlength="1">`).join("")}
              <span style="font-size:1.1rem; align-self:center;">rem.</span>
              <input class="q-box" id="shortRemainder" inputmode="numeric" maxlength="2">
            </div>
            <div class="short-dividend">
              ${digits.map((digit, index) => `
                <div class="short-digit">
                  ${index > 0 ? `<input class="carry" id="carry-${index}" inputmode="numeric" maxlength="2">` : ""}
                  ${digit}
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
      document.getElementById("sq-0").focus();
    }

    function shortWorking() {
      const digits = String(shortProblem.dividend).split("").map(Number);
      let carried = 0;
      const carries = [];
      let quotient = "";
      digits.forEach((digit, index) => {
        const value = carried * 10 + digit;
        const qDigit = Math.floor(value / shortProblem.divisor);
        carried = value % shortProblem.divisor;
        quotient += qDigit;
        if (index < digits.length - 1) carries.push(carried);
      });
      return { quotient: String(Number(quotient)), remainder: carried, carries };
    }

    function checkShortDivision() {
      if (!shortProblem) return setupShortDivision();
      const feedback = document.getElementById("shortFeedback");
      const correct = shortWorking();
      const qInputs = [...document.querySelectorAll("#shortQuotient .q-box")]
        .filter(input => input.id !== "shortRemainder")
        .map(input => input.value.trim()).join("");
      const userQ = String(Number(qInputs || "0"));
      const userR = Number(document.getElementById("shortRemainder").value || "0");
      let carriesOk = true;

      correct.carries.forEach((carry, index) => {
        const input = document.getElementById(`carry-${index + 1}`);
        if (input && Number(input.value || "0") !== carry) carriesOk = false;
      });

      feedback.className = "feedback";
      if (userQ === correct.quotient && userR === correct.remainder && carriesOk) {
        feedback.textContent = "Correct.";
        feedback.classList.add("good");
      } else {
        feedback.textContent = `Check again. Answer should be ${correct.quotient}${correct.remainder ? " rem. " + correct.remainder : ""}.`;
        feedback.classList.add("bad");
      }
    }

    function revealShortDivision() {
      if (!shortProblem) setupShortDivision();
      const correct = shortWorking();
      const qDigits = correct.quotient.split("");
      document.querySelectorAll("#shortQuotient .q-box").forEach((input, index) => {
        if (input.id !== "shortRemainder") input.value = qDigits[index] || "";
      });
      document.getElementById("shortRemainder").value = correct.remainder;
      correct.carries.forEach((carry, index) => {
        const input = document.getElementById(`carry-${index + 1}`);
        if (input) input.value = carry;
      });
      const feedback = document.getElementById("shortFeedback");
      feedback.textContent = "Answer revealed.";
      feedback.className = "feedback good";
    }

    function initCanvas() {
      canvas = document.getElementById("scratchCanvas");
      ctx = canvas.getContext("2d");
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111";
      saveCanvas();

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stopDraw);
      canvas.addEventListener("mouseleave", stopDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", stopDraw);
      window.addEventListener("resize", resizeCanvasForDisplay);
      resizeCanvasForDisplay();
    }

    function resizeCanvasForDisplay() {
      const image = canvas.toDataURL();
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(280, Math.floor(rect.width));
      canvas.height = Math.max(280, Math.floor(rect.height));
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = image;
      setTool(tool);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const point = event.touches ? event.touches[0] : event;
      return { x: point.clientX - rect.left, y: point.clientY - rect.top };
    }

    function startDraw(event) {
      event.preventDefault();
      drawing = true;
      const pos = pointerPosition(event);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(event) {
      if (!drawing) return;
      event.preventDefault();
      const pos = pointerPosition(event);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!drawing) return;
      drawing = false;
      ctx.closePath();
      saveCanvas();
    }

    function setTool(nextTool) {
      tool = nextTool;
      ctx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
      ctx.strokeStyle = "#111";
      ctx.lineWidth = tool === "eraser" ? 18 : 3;
      document.getElementById("pencilBtn").classList.toggle("primary", tool === "pencil");
      document.getElementById("eraserBtn").classList.toggle("primary", tool === "eraser");
    }

    function saveCanvas() {
      history = history.slice(0, historyIndex + 1);
      history.push(canvas.toDataURL());
      historyIndex = history.length - 1;
    }

    function restoreCanvas() {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = history[historyIndex];
    }

    function undoCanvas() {
      if (historyIndex <= 0) return;
      historyIndex -= 1;
      restoreCanvas();
    }

    function redoCanvas() {
      if (historyIndex >= history.length - 1) return;
      historyIndex += 1;
      restoreCanvas();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveCanvas();
    }

    window.addEventListener("load", () => {
      setupLongDivision();
      setupShortDivision();
      switchTab("long");
      initCanvas();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    });
  </script>
</body>

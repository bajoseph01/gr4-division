<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>JoGo Gr4 Division</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gr4 Division">
  <meta name="theme-color" content="#2f7d4f">
  <style>
    :root{--green:#2f7d4f;--dark:#23623d;--paper:#fffdf7;--soft:#f4efe4;--ink:#252525;--muted:#667085;--blue:#d8ecff;--yellow:#ffd166;--red:#d94f45;--line:#ded6c8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior-y:contain}body{font-family:Arial,Helvetica,sans-serif;background:var(--soft);color:var(--ink);padding:14px}.app{width:min(1040px,100%);margin:auto}.brand{text-align:center;margin:8px 0 14px}.brand h1{margin:0;font-size:clamp(1.7rem,4vw,2.4rem)}.brand span{color:#d99018}.brand p{margin:4px 0 0;color:var(--muted)}.panel,.scratch{background:rgba(255,255,255,.98);border:1px solid rgba(0,0,0,.08);border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.08);padding:14px}.top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:11px 14px;min-height:42px;background:#e8ece9;color:var(--ink);font-weight:700;cursor:pointer}.primary,.active{background:var(--green);color:#fff}.secondary{background:#f0f2f4}.quiet{background:#ece8de}.drawer{border:1px solid #e4ddd0;border-radius:10px;background:#fbfaf6;padding:12px;margin-bottom:12px}.hidden{display:none!important}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.controls{display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:8px;align-items:center;margin-bottom:12px}input{border:1px solid #c9c9c9;border-radius:8px;min-height:42px;padding:9px 10px;font-size:1rem;background:#fff}.samples{display:grid;gap:8px}.sampleband{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}.samplelabel{color:#475467;font-size:.82rem;font-weight:700}.samplebuttons{display:flex;flex-wrap:wrap;gap:8px}.samplebuttons button{min-width:72px}.d1{background:#dcfce7;color:#143d25}.d2{background:#bbf7d0;color:#143d25}.d3{background:#fef3c7;color:#3f3208}.d4{background:#fed7aa;color:#4a2505}.d5{background:#fecaca;color:#5f1515}.d6{background:#dc2626;color:#fff}.work{background:var(--paper);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:clamp(14px,3vw,28px);min-height:520px;overflow-x:auto}.longgrid{display:grid;grid-template-columns:minmax(320px,.95fr) minmax(300px,1.05fr);gap:clamp(16px,3vw,30px);align-items:start}.board{font-family:"Courier New",monospace;font-size:clamp(2.2rem,5.5vw,4.6rem);width:max-content;max-width:100%;margin:auto;display:grid;grid-template-columns:auto auto}.divisor{padding-right:8px;margin-top:96px}.house{--cell:clamp(42px,6vw,60px);--gap:10px;--pad:13px}.quotline{min-height:88px;border-bottom:3px solid #111;padding-left:var(--pad);display:grid;grid-template-columns:repeat(var(--n),var(--cell));gap:var(--gap);align-items:end;justify-content:center}.divline{border-left:3px solid #111;padding:8px 10px 0 var(--pad);display:flex;gap:var(--gap);justify-content:center}.digitwrap{display:grid;gap:2px;justify-items:center}.placelabel{font-family:Arial,sans-serif;font-size:.75rem;color:var(--muted);line-height:1}.current{background:var(--yellow);border-radius:7px;padding:0 5px}.cell{display:inline-grid;place-items:center;width:var(--cell);min-height:60px}.empty{color:transparent}.formal{border-left:3px solid transparent;padding-left:var(--pad);padding-right:10px;margin-top:-8px;font-size:clamp(1.9rem,4.8vw,3.8rem)}.row{display:grid;grid-template-columns:repeat(var(--n),var(--cell));gap:var(--gap);justify-content:center;min-height:54px;align-items:center}.workcell{display:grid;place-items:center;line-height:1}.blank{color:transparent}.dot{color:#6b7280;font-size:.7em;align-self:end}.down{font-weight:700}.rule{height:3px;background:#111;align-self:center}.lines{max-height:190px;overflow:auto;margin-bottom:12px;background:rgba(255,255,255,.7);border:1px solid #ebe3d5;border-radius:10px}.lines div{border-bottom:1px solid #ebe3d5;padding:5px 10px}.card{background:#fff;border:1px solid #e5dfd0;border-radius:12px;padding:clamp(14px,3vw,24px);margin:auto;width:min(620px,100%);text-align:center}.card.active{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}.title{margin:0 0 14px;font-size:clamp(1.35rem,3vw,2.1rem);font-weight:700}.prompt{margin:0 0 16px;color:#344054;font-size:clamp(1.05rem,2.2vw,1.35rem)}.field{width:min(260px,100%);margin:auto}.field label{display:block;font-size:.95rem;font-weight:700;color:#475467;margin-bottom:6px}.field input,.qbox{width:100%;text-align:center;font-size:2rem;font-weight:700;min-height:58px;background:var(--blue);border-color:#7fb3e8}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.feedback{min-height:28px;margin-top:14px;font-weight:700;text-align:center;font-size:clamp(1rem,2vw,1.2rem)}.good{color:var(--dark)}.bad{color:var(--red)}.shortgrid{display:flex;justify-content:center;align-items:flex-end;font-family:"Courier New",monospace;font-size:clamp(1.8rem,5vw,3rem);margin:8px 0 18px}.shorthouse{display:grid;grid-template-rows:auto auto}.shortq{border-bottom:3px solid #111;border-left:3px solid transparent;padding-left:12px;display:flex;gap:8px;min-height:54px;align-items:end}.shortdiv{border-left:3px solid #111;padding:8px 10px 0 12px;display:flex;gap:8px}.shortdigit{position:relative;min-width:38px;text-align:center}.carry{position:absolute;top:-22px;left:-8px;width:34px;min-height:30px;padding:0;text-align:center;color:#b42318;background:#fff0f0;font-size:1rem;font-weight:700}.scratch{margin-top:12px}.scratch h2{font-size:1.05rem;margin:0 0 8px;text-align:center}.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}.tools button{min-height:36px;padding:8px 10px;font-size:.85rem}canvas{width:100%;height:300px;border:1px solid #cfcfcf;border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}.vocablink{display:inline-block;margin-top:8px;color:var(--green);font-weight:700}@media(max-width:850px){body{padding:10px}.longgrid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}canvas{height:320px}}@media(max-width:520px){.panel{padding:12px}.controls{grid-template-columns:1fr}.sampleband{grid-template-columns:1fr}.samplebuttons button{flex:1 1 84px}.qbox{width:38px}.top button{flex:1 1 110px}}
  </style>
</head>
<body>
<main class="app">
<header class="brand"><h1>Jo<span>Go</span> Gr4 Division</h1><p>Long division first. Short division after the method makes sense.</p><a class="vocablink" href="./DivisionVocab.html">Open division vocabulary helper</a></header>
<section class="panel">
<div class="top"><button class="quiet" onclick="toggle('teacher')">SETUP</button><button class="quiet" onclick="toggleScratch()">Scratchpad</button></div>
<div id="teacher" class="drawer hidden">
<nav class="tabs"><button id="longTab" class="active" onclick="switchTab('long')">Long Division</button><button id="shortTab" onclick="switchTab('short')">Short Division</button></nav>
<div id="longControls"><div class="controls"><input id="longEquation" value="84 / 4" onkeydown="if(event.key==='Enter')setupLong()"><button class="primary" onclick="setupLong()">Set Up</button><button class="secondary" onclick="resetLong()">Reset</button><button class="secondary" onclick="revealLong()">Reveal</button></div><div class="samples"><div class="sampleband"><div class="samplelabel">2 digit exact</div><div class="samplebuttons"><button class="d1" onclick="sampleLong('48 / 2')">48 / 2</button><button class="d1" onclick="sampleLong('84 / 4')">84 / 4</button><button class="d2" onclick="sampleLong('72 / 6')">72 / 6</button></div></div><div class="sampleband"><div class="samplelabel">3 digit exact</div><div class="samplebuttons"><button class="d2" onclick="sampleLong('132 / 6')">132 / 6</button><button class="d3" onclick="sampleLong('248 / 4')">248 / 4</button><button class="d3" onclick="sampleLong('426 / 3')">426 / 3</button></div></div><div class="sampleband"><div class="samplelabel">remainders</div><div class="samplebuttons"><button class="d4" onclick="sampleLong('85 / 4')">85 / 4</button><button class="d5" onclick="sampleLong('137 / 5')">137 / 5</button><button class="d6" onclick="sampleLong('746 / 9')">746 / 9</button></div></div></div></div>
<div id="shortControls" class="hidden"><div class="controls"><input id="shortEquation" value="852 / 8" onkeydown="if(event.key==='Enter')setupShort()"><button class="primary" onclick="setupShort()">Set Up</button><button class="secondary" onclick="checkShort()">Check</button><button class="secondary" onclick="revealShort()">Reveal</button></div><div class="samplebuttons"><button onclick="sampleShort('246 / 2')">246 / 2</button><button onclick="sampleShort('852 / 8')">852 / 8</button><button onclick="sampleShort('936 / 3')">936 / 3</button><button onclick="sampleShort('725 / 6')">725 / 6</button></div></div>
</div>
<section id="longPanel"><div class="work longgrid"><div id="longBoard"></div><div id="longStep"></div><div id="longFeedback" class="feedback"></div></div></section>
<section id="shortPanel" class="hidden"><div class="work"><div id="shortBoard"></div><div id="shortFeedback" class="feedback"></div></div></section>
</section>
<aside id="scratch" class="scratch hidden"><h2>Scratchpad</h2><div class="tools"><button id="pencilBtn" class="primary" onclick="setTool('pencil')">Pencil</button><button id="eraserBtn" onclick="setTool('eraser')">Eraser</button><button onclick="undoCanvas()">Undo</button><button onclick="redoCanvas()">Redo</button><button onclick="clearCanvas()">Clear</button></div><canvas id="canvas" width="320" height="430"></canvas></aside>
</main>
<script>
let tab='long',lp=null,li=0,pi=0,ready=false,sp=null,canvas,ctx,drawing=false,tool='pencil',hist=[],hi=-1;
function parse(v){let p=v.split('/').map(x=>x.trim()),a=Number(p[0]),b=Number(p[1]);if(p.length!==2)return{error:'Use this format: 84 / 4'};if(!Number.isInteger(a)||!Number.isInteger(b))return{error:'Use whole numbers only.'};if(a<0||b<=0)return{error:'Dividend must be 0 or more. Divisor must be bigger than 0.'};if(b>12)return{error:'For Grade 4 practice, keep the divisor 12 or less.'};return{dividend:a,divisor:b}}
function toggle(id){document.getElementById(id).classList.toggle('hidden')}function toggleScratch(){toggle('scratch');resizeCanvas()}function switchTab(t){tab=t;longPanel.classList.toggle('hidden',t!=='long');shortPanel.classList.toggle('hidden',t!=='short');longControls.classList.toggle('hidden',t!=='long');shortControls.classList.toggle('hidden',t!=='short');longTab.classList.toggle('active',t==='long');shortTab.classList.toggle('active',t==='short')}function sampleLong(s){longEquation.value=s;setupLong()}function sampleShort(s){shortEquation.value=s;setupShort()}
function label(i,n){return(['ones','tens','hundreds','thousands','ten thousands'][n-i-1]||'')}function steps(a,b){let ds=String(a).split('').map(Number),out=[],part=0,start=0;ds.forEach((d,i)=>{part=part*10+d;let last=i===ds.length-1;if(part>=b||last){let q=Math.floor(part/b),prod=q*b,rem=part-prod;out.push({startIndex:start,endIndex:i,partial:part,qDigit:q,product:prod,remainder:rem,bringDown:last?'':String(ds[i+1])});part=rem;start=i+1}});return out}
function setupLong(){let x=parse(longEquation.value),f=longFeedback;f.textContent='';f.className='feedback';if(x.error){longBoard.innerHTML=longStep.innerHTML='';f.textContent=x.error;f.classList.add('bad');return}lp={dividend:x.dividend,divisor:x.divisor,steps:steps(x.dividend,x.divisor)};li=0;pi=0;ready=false;renderLong()}function resetLong(){if(!lp)return setupLong();li=0;pi=0;ready=false;renderLong()}function parts(s){return s.bringDown===''?['divide','multiply','subtract']:['divide','multiply','subtract','bring']}function cur(){return lp.steps[li]?parts(lp.steps[li])[pi]:null}
function detail(s,p){return{divide:{title:'Divide',prompt:`How many ${lp.divisor}s fit into ${s.partial}?`,label:'Quotient digit',answer:String(s.qDigit)},multiply:{title:'Multiply',prompt:`${lp.divisor} x ${s.qDigit} = ?`,label:'Product',answer:String(s.product)},subtract:{title:'Subtract',prompt:`${s.partial} - ${s.product} = ?`,label:'Remainder',answer:String(s.remainder)},bring:{title:'Bring Down',prompt:'Which digit comes down next?',label:'Next digit',answer:s.bringDown}}[p]}function line(s,p){return{divide:`${lp.divisor} into ${s.partial} = ${s.qDigit}`,multiply:`${lp.divisor} x ${s.qDigit} = ${s.product}`,subtract:`${s.partial} - ${s.product} = ${s.remainder===0?'.':s.remainder}`,bring:`Bring down ${s.bringDown}`}[p]}
function visible(si,p){let ps=parts(lp.steps[si]),c=0;if(si<li)c=ps.length;if(si===li)c=pi+(ready?1:0);return ps.slice(0,c).includes(p)}function lines(){let a=[];lp.steps.forEach((s,si)=>parts(s).forEach(p=>{if(visible(si,p))a.push(line(s,p))}));return a.length?`<div class="lines">${a.map(x=>`<div>${x}</div>`).join('')}</div>`:''}
function cells(val,start,end,n){let c=Array(n).fill(''),span=end-start+1,ds=String(val).padStart(span,' ').split(''),first=Math.max(start,end-ds.length+1);ds.forEach((d,o)=>{let col=first+o;if(col>=0&&col<n&&d!==' ')c[col]=d});return c}function numrow(c,n){return`<div class="row" style="--n:${n}">${c.map(x=>{let v=typeof x==='object'?x.value:x,cl=typeof x==='object'?x.className:'';return`<span class="workcell ${v===''?'blank':''} ${cl}">${v||'0'}</span>`}).join('')}</div>`}function ruler(s,e,n){let c=Array(n).fill('');for(let i=s;i<=e;i++)c[i]='<span class="rule"></span>';return`<div class="row" style="--n:${n}">${c.map(x=>x||'<span class="workcell blank">0</span>').join('')}</div>`}function formal(n){let r=[];lp.steps.forEach((s,si)=>{if(visible(si,'multiply')){r.push(numrow(cells(s.product,s.startIndex,s.endIndex,n),n));r.push(ruler(s.startIndex,s.endIndex,n))}if(visible(si,'subtract')){let c=Array(n).fill('');c[s.endIndex]=s.remainder===0?{value:'.',className:'dot'}:String(s.remainder);if(visible(si,'bring')&&s.bringDown)c[s.endIndex+1]={value:s.bringDown,className:'down'};r.push(numrow(c,n))}});return`<div class="formal">${r.join('')}</div>`}
function renderLong(){let ds=String(lp.dividend).split(''),qc=Array(ds.length).fill(''),act=lp.steps[li];lp.steps.forEach((s,i)=>{if(i<li||(i===li&&(pi>0||(ready&&cur()==='divide'))))qc[s.endIndex]=String(s.qDigit)});longBoard.innerHTML=`<div class="board"><div class="divisor">${lp.divisor}</div><div class="house"><div class="quotline" style="--n:${ds.length}">${qc.map(d=>`<span class="cell ${d===''?'empty':''}">${d||'0'}</span>`).join('')}</div><div class="divline">${ds.map((d,i)=>`<div class="digitwrap"><span class="placelabel">${label(i,ds.length)}</span><span class="${act&&i>=act.startIndex&&i<=act.endIndex?'current':''}">${d}</span></div>`).join('')}</div>${formal(ds.length)}</div></div>`;if(!act){let q=Math.floor(lp.dividend/lp.divisor),r=lp.dividend%lp.divisor;longStep.innerHTML=`${lines()}<div class="card active"><p class="title">Complete: ${lp.dividend} / ${lp.divisor} = ${q}${r?' rem. '+r:''}</p></div>`;return}let d=detail(act,cur());longStep.innerHTML=`${lines()}<div class="card active"><p class="title">${d.title}</p><p class="prompt">${d.prompt}</p><div class="field"><label>${d.label}</label><input id="longAnswer" inputmode="numeric" value="${ready?d.answer:''}" ${ready?'disabled':''} onkeydown="if(event.key==='Enter')longMain()"></div><div class="actions"><button class="primary" onclick="longMain()">${ready?'Next':'Check'}</button></div></div>`;(ready?document.querySelector('.actions button'):longAnswer).focus()}
function longMain(){ready?advance():checkLong()}function checkLong(){let s=lp.steps[li],p=cur(),d=detail(s,p),a=longAnswer.value.trim(),f=longFeedback;f.className='feedback';if(a!==d.answer){f.textContent={divide:`Think: how many ${lp.divisor}s fit without going over ${s.partial}?`,multiply:'Use the quotient digit you just found.',subtract:'Subtract the product from the number you divided.',bring:'Look at the next digit in the dividend.'}[p];f.classList.add('bad');return}ready=true;f.textContent='Good.';f.classList.add('good');renderLong()}function revealLong(){if(!lp)setupLong();let s=lp.steps[li];if(!s)return;ready=true;longFeedback.textContent='Revealed.';longFeedback.className='feedback good';renderLong()}function advance(){let ps=parts(lp.steps[li]);if(pi<ps.length-1)pi++;else{li++;pi=0}ready=false;longFeedback.textContent='';renderLong()}
function setupShort(){let x=parse(shortEquation.value),b=shortBoard,f=shortFeedback;f.textContent='';f.className='feedback';if(x.error){b.innerHTML='';f.textContent=x.error;f.classList.add('bad');return}sp=x;let ds=String(x.dividend).split('');b.innerHTML=`<div class="shortgrid"><div class="divisor">${x.divisor}</div><div class="shorthouse"><div class="shortq" id="shortQ">${ds.map((_,i)=>`<input class="qbox" id="sq-${i}" inputmode="numeric" maxlength="1">`).join('')}<span style="font-size:1.1rem;align-self:center">rem.</span><input class="qbox" id="shortR" inputmode="numeric" maxlength="2"></div><div class="shortdiv">${ds.map((d,i)=>`<div class="shortdigit">${i>0?`<input class="carry" id="carry-${i}" inputmode="numeric" maxlength="2">`:''}${d}</div>`).join('')}</div></div></div>`;document.getElementById('sq-0').focus()}function shortWork(){let ds=String(sp.dividend).split('').map(Number),car=0,carries=[],q='';ds.forEach((d,i)=>{let v=car*10+d,qd=Math.floor(v/sp.divisor);car=v%sp.divisor;q+=qd;if(i<ds.length-1)carries.push(car)});return{quotient:String(Number(q)),remainder:car,carries}}
function checkShort(){if(!sp)return setupShort();let c=shortWork(),q=[...document.querySelectorAll('#shortQ .qbox')].filter(i=>i.id!=='shortR').map(i=>i.value.trim()).join(''),uq=String(Number(q||'0')),ur=Number(shortR.value||'0'),ok=true;c.carries.forEach((v,i)=>{let el=document.getElementById(`carry-${i+1}`);if(el&&Number(el.value||'0')!==v)ok=false});shortFeedback.className='feedback';if(uq===c.quotient&&ur===c.remainder&&ok){shortFeedback.textContent='Correct.';shortFeedback.classList.add('good')}else{shortFeedback.textContent=`Check again. Answer should be ${c.quotient}${c.remainder?' rem. '+c.remainder:''}.`;shortFeedback.classList.add('bad')}}function revealShort(){if(!sp)setupShort();let c=shortWork(),q=c.quotient.split('');document.querySelectorAll('#shortQ .qbox').forEach((i,n)=>{if(i.id!=='shortR')i.value=q[n]||''});shortR.value=c.remainder;c.carries.forEach((v,i)=>{let el=document.getElementById(`carry-${i+1}`);if(el)el.value=v});shortFeedback.textContent='Answer revealed.';shortFeedback.className='feedback good'}
function initCanvas(){canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';setTool('pencil');saveCanvas();['mousedown','touchstart'].forEach(e=>canvas.addEventListener(e,start,{passive:false}));['mousemove','touchmove'].forEach(e=>canvas.addEventListener(e,draw,{passive:false}));['mouseup','mouseleave','touchend','touchcancel'].forEach(e=>canvas.addEventListener(e,stop));window.addEventListener('resize',resizeCanvas);resizeCanvas()}function resizeCanvas(){if(!canvas)return;let img=canvas.toDataURL(),r=canvas.getBoundingClientRect();canvas.width=Math.max(280,Math.floor(r.width));canvas.height=Math.max(280,Math.floor(r.height));let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,canvas.width,canvas.height);im.src=img;setTool(tool)}function pos(e){let r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function start(e){e.preventDefault();drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}function draw(e){if(!drawing)return;e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}function stop(){if(!drawing)return;drawing=false;ctx.closePath();saveCanvas()}function setTool(t){tool=t;if(!ctx)return;ctx.globalCompositeOperation=t==='eraser'?'destination-out':'source-over';ctx.strokeStyle='#111';ctx.lineWidth=t==='eraser'?18:3;pencilBtn.classList.toggle('primary',t==='pencil');eraserBtn.classList.toggle('primary',t==='eraser')}function saveCanvas(){hist=hist.slice(0,hi+1);hist.push(canvas.toDataURL());hi=hist.length-1}function restore(){let im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=hist[hi]}function undoCanvas(){if(hi<=0)return;hi--;restore()}function redoCanvas(){if(hi>=hist.length-1)return;hi++;restore()}function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);saveCanvas()}
window.addEventListener('load',()=>{setupLong();setupShort();switchTab('long');initCanvas();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
</body>
</html>

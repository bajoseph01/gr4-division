<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoGo Gr4 Division · V2</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gr4 Division">
  <meta name="theme-color" content="#07552d">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <h1>JoGo Gr4 Division</h1>
      <span class="version">V2</span>
      <button id="teacherToggle" type="button" aria-expanded="false" aria-controls="teacherDrawer" onclick="toggleTeacherDrawer()">Teacher settings</button>
    </header>

    <section class="shell">
      <div class="panel">
          <nav class="tabs" aria-label="Division modes">
            <button class="tab-button active" id="longTab" type="button" aria-pressed="true" aria-controls="longPanel" onclick="switchTab('long')">Long Division</button>
            <button class="tab-button" id="shortTab" type="button" aria-pressed="false" aria-controls="shortPanel" onclick="switchTab('short')">Short Division</button>
          </nav>
        <div id="teacherDrawer" class="teacher-drawer hidden">

          <div id="longTeacherControls">
            <div class="controls">
              <input id="longEquation" type="text" value="48 ÷ 2" aria-label="Long division problem" onkeydown="handleSetupKey(event, 'long')">
              <button class="primary" type="button" onclick="setupLongDivision()">Set Up</button>
              <button class="secondary" type="button" onclick="resetLongWork()">Reset</button>
              <button class="secondary" type="button" onclick="revealLongStep()">Reveal</button>
            </div>
            <div id="sampleBank" class="sample-bank" aria-label="Long division sample problems"></div>
          </div>

          <div id="shortTeacherControls" class="hidden">
            <div class="controls">
              <input id="shortEquation" type="text" value="48 ÷ 2" aria-label="Short division problem" onkeydown="handleSetupKey(event, 'short')">
              <button class="primary" type="button" onclick="setupShortDivision()">Set Up</button>
              <button class="secondary" type="button" onclick="checkShortDivision()">Check</button>
              <button class="secondary" type="button" onclick="revealShortDivision()">Reveal</button>
            </div>
            <div class="sample-row" aria-label="Short division sample problems">
              <button type="button" onclick="setShortSample('246 ÷ 2')">246 ÷ 2</button>
              <button type="button" onclick="setShortSample('852 ÷ 8')">852 ÷ 8</button>
              <button type="button" onclick="setShortSample('936 ÷ 3')">936 ÷ 3</button>
              <button type="button" onclick="setShortSample('725 ÷ 6')">725 ÷ 6</button>
            </div>
          </div>
        </div>

        <section id="longPanel">
          <h2 class="problem-heading"><span id="longProblemHeading">48 ÷ 2</span></h2>
          <div class="work-area long-work-area">
            <div class="board-column">
              <div class="practice-controls">
                <label for="practiceLevel">Practice level</label>
                <select id="practiceLevel" onchange="setPracticeLevel(this.value)" aria-describedby="practiceStatus"></select>
                <button id="nextPractice" type="button" onclick="nextPracticeProblem()" disabled>Next problem</button>
                <p id="practiceStatus" aria-live="polite"></p>
              </div>
              <div id="longBoard" tabindex="0" role="region" aria-label="Long division working board"></div>
            </div>
            <aside class="lesson-column" aria-label="Current division step">
              <div class="lesson-card">
                <div id="longStepArea"></div>
                <div class="secondary-actions">
                  <button type="button" onclick="revealLongStep()">Reveal</button>
                  <button type="button" onclick="resetLongWork()">Reset</button>
                </div>
                <div id="longFeedback" class="feedback" aria-live="polite"></div>
              </div>
              <div class="lesson-tools">
                <button type="button" onclick="toggleTeacherDrawer()">Teacher tools</button>
                <button type="button" aria-controls="scratchpadPanel" onclick="toggleScratchpad()">Scratchpad</button>
              </div>
            </aside>
          </div>
        </section>

        <section id="shortPanel" class="hidden">
          <h2 class="problem-heading"><span id="shortProblemHeading">48 ÷ 2</span></h2>
          <div class="work-area">
            <div id="shortBoard"></div>
            <div class="secondary-actions">
              <button class="primary" type="button" onclick="checkShortDivision()">Check</button>
              <button type="button" onclick="revealShortDivision()">Reveal</button>
              <button type="button" onclick="toggleScratchpad()">Scratchpad</button>
            </div>
            <div id="shortFeedback" class="feedback" aria-live="polite"></div>
          </div>
        </section>
      </div>

      <aside id="scratchpadPanel" class="scratchpad hidden">
        <h2>Scratchpad</h2>
        <div class="tools">
          <button id="pencilBtn" class="primary" type="button" onclick="setTool('pencil')">Pencil</button>
          <button id="eraserBtn" type="button" onclick="setTool('eraser')">Eraser</button>
          <button type="button" onclick="undoCanvas()">Undo</button>
          <button type="button" onclick="redoCanvas()">Redo</button>
          <button type="button" onclick="clearCanvas()">Clear</button>
        </div>
        <canvas id="scratchCanvas" width="320" height="430"></canvas>
      </aside>
    </section>
  </main>

  <script>
    let currentTab = "long";
    let longProblem = null;
    let longStepIndex = 0;
    let longPartIndex = 0;
    let longReadyForNext = false;
    let shortProblem = null;
    let canvas;
    let ctx;
    let drawing = false;
    let tool = "pencil";
    let history = [];
    let historyIndex = -1;

    const practiceLevels = [
      { name: "2 digits · no remainder", note: "No carrying between columns", problems: ["48 ÷ 2", "84 ÷ 4", "96 ÷ 3"] },
      { name: "2 digits · carrying", note: "Carry between columns; no final remainder", problems: ["75 ÷ 5", "72 ÷ 6"] },
      { name: "2 digits · with remainder", note: "Learn to finish with a remainder", problems: ["85 ÷ 4", "74 ÷ 3", "59 ÷ 5", "97 ÷ 6", "79 ÷ 4"] },
      { name: "3 digits · no remainder", note: "Build up to a longer dividend", problems: ["156 ÷ 3", "864 ÷ 4", "426 ÷ 3", "248 ÷ 4", "132 ÷ 6"] },
      { name: "3 digits · with remainder", note: "Longer working with a final remainder", problems: ["137 ÷ 5", "258 ÷ 4", "347 ÷ 6", "529 ÷ 7", "746 ÷ 9"] }
    ];

    function initPractice() {
      document.getElementById("practiceLevel").innerHTML = practiceLevels.map((level, index) => `<option value="${index}">${index + 1}. ${level.name}</option>`).join("") + '<option value="custom" disabled>Custom problem</option>';
      document.getElementById("sampleBank").innerHTML = practiceLevels.map((level, index) => `<div class="sample-band"><div class="sample-label">${index + 1}. ${level.name}</div><div class="sample-buttons">${level.problems.map(problem => `<button type="button" onclick="setLongSample('${problem}')">${problem}</button>`).join("")}</div></div>`).join("");
    }

    function practicePosition() {
      if (!longProblem) return { level: -1, problem: -1 };
      const equation = `${longProblem.dividend} ÷ ${longProblem.divisor}`;
      const level = practiceLevels.findIndex(item => item.problems.includes(equation));
      return { level, problem: level < 0 ? -1 : practiceLevels[level].problems.indexOf(equation) };
    }

    function updatePracticeControls() {
      const position = practicePosition();
      const button = document.getElementById("nextPractice");
      const level = practiceLevels[position.level];
      const finished = !!longProblem && !longProblem.steps[longStepIndex];
      document.getElementById("practiceLevel").value = level ? String(position.level) : "custom";
      document.getElementById("practiceStatus").textContent = level
        ? `Problem ${position.problem + 1} of ${level.problems.length} · ${level.note}`
        : "Custom problem · choose a level to return to guided practice";
      button.disabled = !finished;
      button.textContent = !level ? "Start practice" : position.problem < level.problems.length - 1
        ? "Next problem" : position.level < practiceLevels.length - 1 ? "Next level" : "Practise again";
    }

    function setPracticeLevel(value) {
      const level = practiceLevels[Number(value)];
      if (level) setLongSample(level.problems[0]);
    }

    function nextPracticeProblem() {
      if (!longProblem || longProblem.steps[longStepIndex]) return;
      const position = practicePosition();
      const level = practiceLevels[position.level];
      if (!level) return setPracticeLevel(0);
      if (position.problem + 1 < level.problems.length) setLongSample(level.problems[position.problem + 1]);
      else setPracticeLevel(position.level + 1 < practiceLevels.length ? position.level + 1 : position.level);
    }

    function parseEquation(value) {
      const parts = value.split(/[÷/]/).map(part => part.trim());
      if (parts.length !== 2) return { error: "Use this format: 84 ÷ 4" };
      if (parts.some(part => !/^\d+$/.test(part))) return { error: "Use whole numbers only." };
      const dividend = Number(parts[0]);
      const divisor = Number(parts[1]);
      if (!Number.isSafeInteger(dividend) || !Number.isSafeInteger(divisor)) return { error: "Use smaller whole numbers." };
      if (dividend < 0 || divisor <= 0) return { error: "The dividend must be 0 or more, and the divisor must be bigger than 0." };
      if (divisor > 12) return { error: "For Grade 4 practice, keep the divisor 12 or less." };
      return { dividend, divisor };
    }

    function toggleTeacherDrawer() {
      const hidden = document.getElementById("teacherDrawer").classList.toggle("hidden");
      document.getElementById("teacherToggle").setAttribute("aria-expanded", String(!hidden));
    }

    function toggleScratchpad() {
      const panel = document.getElementById("scratchpadPanel");
      panel.classList.toggle("hidden");
      if (!panel.classList.contains("hidden")) resizeCanvasForDisplay();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("longPanel").classList.toggle("hidden", tab !== "long");
      document.getElementById("shortPanel").classList.toggle("hidden", tab !== "short");
      document.getElementById("longTeacherControls").classList.toggle("hidden", tab !== "long");
      document.getElementById("shortTeacherControls").classList.toggle("hidden", tab !== "short");
      document.getElementById("longTab").classList.toggle("active", tab === "long");
      document.getElementById("shortTab").classList.toggle("active", tab === "short");
      document.getElementById("longTab").setAttribute("aria-pressed", String(tab === "long"));
      document.getElementById("shortTab").setAttribute("aria-pressed", String(tab === "short"));
      if (tab === "long") requestAnimationFrame(drawBringDownArrows);
    }

    function setLongSample(problem) {
      document.getElementById("longEquation").value = problem;
      setupLongDivision();
    }

    function setShortSample(problem) {
      document.getElementById("shortEquation").value = problem;
      setupShortDivision();
    }

    function handleSetupKey(event, mode) {
      if (event.key !== "Enter") return;
      event.preventDefault();
      if (mode === "long") setupLongDivision();
      else setupShortDivision();
    }

    function placeLabel(index, length) {
      const labels = ["ones", "tens", "hundreds", "thousands", "ten thousands"];
      return labels[length - index - 1] || "";
    }

    function buildLongSteps(dividend, divisor) {
      const digits = String(dividend).split("").map(Number);
      const steps = [];
      let partial = 0;
      let startIndex = 0;

      digits.forEach((digit, index) => {
        partial = partial * 10 + digit;
        const isLast = index === digits.length - 1;
        if (partial >= divisor || isLast || steps.length > 0) {
          const qDigit = Math.floor(partial / divisor);
          const product = qDigit * divisor;
          const remainder = partial - product;
          steps.push({
            startIndex,
            endIndex: index,
            partial,
            qDigit,
            product,
            remainder,
            bringDown: isLast ? "" : String(digits[index + 1])
          });
          partial = remainder;
          startIndex = index + 1;
        }
      });

      return steps;
    }

    function setupLongDivision() {
      const parsed = parseEquation(document.getElementById("longEquation").value);
      const feedback = document.getElementById("longFeedback");
      feedback.textContent = "";
      feedback.className = "feedback";

      if (parsed.error) {
        longProblem = null;
        document.getElementById("longProblemHeading").textContent = "Choose a division problem";
        document.getElementById("longBoard").innerHTML = "";
        document.getElementById("longStepArea").innerHTML = "";
        feedback.textContent = parsed.error;
        feedback.classList.add("bad");
        updatePracticeControls();
        return;
      }

      longProblem = {
        dividend: parsed.dividend,
        divisor: parsed.divisor,
        steps: buildLongSteps(parsed.dividend, parsed.divisor)
      };
      longStepIndex = 0;
      longPartIndex = 0;
      longReadyForNext = false;
      document.getElementById("longProblemHeading").textContent = `${parsed.dividend} ÷ ${parsed.divisor}`;
      renderLongDivision();
    }

    function resetLongWork() {
      if (!longProblem) return setupLongDivision();
      longStepIndex = 0;
      longPartIndex = 0;
      longReadyForNext = false;
      document.getElementById("longFeedback").textContent = "";
      renderLongDivision();
    }

    function longPartsForStep(step) {
      return step.bringDown === "" ? ["divide", "multiply", "subtract"] : ["divide", "multiply", "subtract", "bring"];
    }

    function currentLongPart() {
      const step = longProblem.steps[longStepIndex];
      if (!step) return null;
      return longPartsForStep(step)[longPartIndex];
    }

    function longPartDetails(step, part) {
      const details = {
        divide: {
          title: "Divide",
          prompt: `How many ${longProblem.divisor}s fit into ${step.partial}?`,
          label: "Quotient digit",
          answer: String(step.qDigit)
        },
        multiply: {
          title: "Multiply",
          prompt: `${longProblem.divisor} × ${step.qDigit} = ?`,
          label: "Product",
          answer: String(step.product)
        },
        subtract: {
          title: "Subtract",
          prompt: `${step.partial} − ${step.product} = ?`,
          label: "Remainder",
          answer: String(step.remainder)
        },
        bring: {
          title: "Bring Down",
          prompt: "Which digit comes down next?",
          label: "Next digit",
          answer: step.bringDown
        }
      };
      return details[part];
    }

    function longStepLine(step, part) {
      const lines = {
        divide: `${longProblem.divisor} into ${step.partial} = ${step.qDigit}`,
        multiply: `${longProblem.divisor} × ${step.qDigit} = ${step.product}`,
        subtract: `${step.partial} − ${step.product} = ${step.remainder}`,
        bring: `Bring down ${step.bringDown}`
      };
      return lines[part];
    }

    function renderWorkingLines() {
      const lines = [];
      longProblem.steps.forEach((step, stepIndex) => {
        const parts = longPartsForStep(step);
        let visibleCount = 0;
        if (stepIndex < longStepIndex) visibleCount = parts.length;
        if (stepIndex === longStepIndex) visibleCount = longPartIndex + (longReadyForNext ? 1 : 0);
        parts.slice(0, visibleCount).forEach(part => lines.push(longStepLine(step, part)));
      });
      return lines.length ? `<details class="working-lines"><summary>Working in words</summary><div class="working-list">${lines.map(line => `<div>${line}</div>`).join("")}</div></details>` : "";
    }

    function isLongPartVisible(stepIndex, partName) {
      const step = longProblem.steps[stepIndex];
      const parts = longPartsForStep(step);
      let visibleCount = 0;
      if (stepIndex < longStepIndex) visibleCount = parts.length;
      if (stepIndex === longStepIndex) visibleCount = longPartIndex + (longReadyForNext ? 1 : 0);
      return parts.slice(0, visibleCount).includes(partName);
    }

    function handleLongMainAction() {
      if (longReadyForNext) advanceLongPart();
      else checkLongStep();
    }

    function syncLongAnswer(source) {
      const boxes = [...document.querySelectorAll('[data-board-digit]')];
      if (source.matches('[data-board-digit]')) {
        document.getElementById("longAnswer").value = boxes.map(box => box.value).join("");
        const next = boxes[Number(source.dataset.boardDigit) + 1];
        if (source.value.length === 1 && next) next.focus({ preventScroll: true });
      } else {
        boxes.forEach((box, index) => { box.value = source.value[index] || ""; });
      }
    }

    function handleLongAnswerKey(event) {
      if (event.key === "Backspace" && event.target.matches('[data-board-digit]') && event.target.value === "") {
        const previous = document.querySelector(`[data-board-digit="${Number(event.target.dataset.boardDigit) - 1}"]`);
        if (previous) { event.preventDefault(); previous.focus({ preventScroll: true }); }
      }
      if (event.key !== "Enter") return;
      event.preventDefault();
      handleLongMainAction();
    }

    function checkLongStep() {
      if (!longProblem || !longProblem.steps[longStepIndex]) return;
      const active = longProblem.steps[longStepIndex];
      const feedback = document.getElementById("longFeedback");
      const part = currentLongPart();
      const detail = longPartDetails(active, part);
      const answer = document.getElementById("longAnswer").value.trim();
      feedback.className = "feedback";

      if (answer !== detail.answer) {
        const hints = {
          divide: `Think: how many ${longProblem.divisor}s can fit without going over ${active.partial}?`,
          multiply: "Use the quotient digit you just found.",
          subtract: "Subtract the product from the number you divided.",
          bring: "Look at the next digit in the dividend."
        };
        feedback.textContent = hints[part];
        feedback.classList.add("bad");
        return;
      }

      longReadyForNext = true;
      feedback.textContent = "Good.";
      feedback.classList.add("good");
      renderLongDivision();
    }

    function revealLongStep() {
      if (!longProblem) return setupLongDivision();
      const active = longProblem.steps[longStepIndex];
      if (!active) return;
      const detail = longPartDetails(active, currentLongPart());
      document.getElementById("longAnswer").value = detail.answer;
      longReadyForNext = true;
      const feedback = document.getElementById("longFeedback");
      feedback.textContent = "Revealed.";
      feedback.className = "feedback good";
      renderLongDivision();
    }

    function advanceLongPart() {
      if (!longProblem || !longProblem.steps[longStepIndex]) return;
      const parts = longPartsForStep(longProblem.steps[longStepIndex]);
      if (longPartIndex < parts.length - 1) {
        longPartIndex += 1;
      } else {
        longStepIndex += 1;
        longPartIndex = 0;
      }
      longReadyForNext = false;
      const feedback = document.getElementById("longFeedback");
      feedback.textContent = longProblem.steps[longStepIndex] && currentLongPart() === "divide" && longStepIndex > 0
        ? `${longProblem.steps[longStepIndex - 1].bringDown} brought down. Now divide ${longProblem.steps[longStepIndex].partial}.` : "";
      feedback.className = "feedback good";
      renderLongDivision();
    }

    function nextLongStep() {
      advanceLongPart();
    }

    function setupShortDivision() {
      const parsed = parseEquation(document.getElementById("shortEquation").value);
      const board = document.getElementById("shortBoard");
      const feedback = document.getElementById("shortFeedback");
      feedback.textContent = "";
      feedback.className = "feedback";

      if (parsed.error) {
        shortProblem = null;
        document.getElementById("shortProblemHeading").textContent = "Choose a division problem";
        board.innerHTML = "";
        feedback.textContent = parsed.error;
        feedback.classList.add("bad");
        return;
      }

      shortProblem = parsed;
      document.getElementById("shortProblemHeading").textContent = `${parsed.dividend} ÷ ${parsed.divisor}`;
      const digits = String(parsed.dividend).split("");
      board.innerHTML = `
        <div class="short-grid">
          <div class="divisor">${parsed.divisor}</div>
          <div class="short-house">
            <div class="short-quotient" id="shortQuotient">
              ${digits.map((_, index) => `<input class="q-box" id="sq-${index}" aria-label="${placeLabel(index, digits.length)} quotient digit" inputmode="numeric" maxlength="1">`).join("")}
              <span style="font-size:1.1rem; align-self:center;">rem.</span>
              <input class="q-box" id="shortRemainder" aria-label="Final remainder" inputmode="numeric" maxlength="2">
            </div>
            <div class="short-dividend">
              ${digits.map((digit, index) => `
                <div class="short-digit">
                  ${index > 0 ? `<input class="carry" id="carry-${index}" aria-label="Remainder carried into ${placeLabel(index, digits.length)}" inputmode="numeric" maxlength="2">` : ""}
                  ${digit}
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function shortWorking() {
      const digits = String(shortProblem.dividend).split("").map(Number);
      let carried = 0;
      const carries = [];
      let quotient = "";
      digits.forEach((digit, index) => {
        const value = carried * 10 + digit;
        const qDigit = Math.floor(value / shortProblem.divisor);
        carried = value % shortProblem.divisor;
        quotient += qDigit;
        if (index < digits.length - 1) carries.push(carried);
      });
      return { quotient: String(Number(quotient)), remainder: carried, carries };
    }

    function checkShortDivision() {
      if (!shortProblem) return setupShortDivision();
      const feedback = document.getElementById("shortFeedback");
      const correct = shortWorking();
      const qInputs = [...document.querySelectorAll("#shortQuotient .q-box")]
        .filter(input => input.id !== "shortRemainder")
        .map(input => input.value.trim()).join("");
      const userQ = String(Number(qInputs || "0"));
      const userR = Number(document.getElementById("shortRemainder").value || "0");
      let carriesOk = true;

      correct.carries.forEach((carry, index) => {
        const input = document.getElementById(`carry-${index + 1}`);
        if (input && Number(input.value || "0") !== carry) carriesOk = false;
      });

      feedback.className = "feedback";
      if (userQ === correct.quotient && userR === correct.remainder && carriesOk) {
        feedback.textContent = "Correct.";
        feedback.classList.add("good");
      } else {
        feedback.textContent = `Check again. Answer should be ${correct.quotient}${correct.remainder ? " rem. " + correct.remainder : ""}.`;
        feedback.classList.add("bad");
      }
    }

    function revealShortDivision() {
      if (!shortProblem) setupShortDivision();
      if (!shortProblem) return;
      const correct = shortWorking();
      const qDigits = correct.quotient.padStart(String(shortProblem.dividend).length, ' ').split("");
      document.querySelectorAll("#shortQuotient .q-box").forEach((input, index) => {
        if (input.id !== "shortRemainder") input.value = qDigits[index] || "";
      });
      document.getElementById("shortRemainder").value = correct.remainder;
      correct.carries.forEach((carry, index) => {
        const input = document.getElementById(`carry-${index + 1}`);
        if (input) input.value = carry;
      });
      const feedback = document.getElementById("shortFeedback");
      feedback.textContent = "Answer revealed.";
      feedback.className = "feedback good";
    }

    function initCanvas() {
      canvas = document.getElementById("scratchCanvas");
      ctx = canvas.getContext("2d");
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111";
      saveCanvas();

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stopDraw);
      canvas.addEventListener("mouseleave", stopDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", stopDraw);
      window.addEventListener("resize", resizeCanvasForDisplay);
      resizeCanvasForDisplay();
    }

    function resizeCanvasForDisplay() {
      const image = canvas.toDataURL();
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(280, Math.floor(rect.width));
      canvas.height = Math.max(280, Math.floor(rect.height));
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = image;
      setTool(tool);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const point = event.touches ? event.touches[0] : event;
      return { x: point.clientX - rect.left, y: point.clientY - rect.top };
    }

    function startDraw(event) {
      event.preventDefault();
      drawing = true;
      const pos = pointerPosition(event);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(event) {
      if (!drawing) return;
      event.preventDefault();
      const pos = pointerPosition(event);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!drawing) return;
      drawing = false;
      ctx.closePath();
      saveCanvas();
    }

    function setTool(nextTool) {
      tool = nextTool;
      ctx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
      ctx.strokeStyle = "#111";
      ctx.lineWidth = tool === "eraser" ? 18 : 3;
      document.getElementById("pencilBtn").classList.toggle("primary", tool === "pencil");
      document.getElementById("eraserBtn").classList.toggle("primary", tool === "eraser");
    }

    function saveCanvas() {
      history = history.slice(0, historyIndex + 1);
      history.push(canvas.toDataURL());
      historyIndex = history.length - 1;
    }

    function restoreCanvas() {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = history[historyIndex];
    }

    function undoCanvas() {
      if (historyIndex <= 0) return;
      historyIndex -= 1;
      restoreCanvas();
    }

    function redoCanvas() {
      if (historyIndex >= history.length - 1) return;
      historyIndex += 1;
      restoreCanvas();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveCanvas();
    }

    window.addEventListener("load", () => {
      initPractice();
      setupLongDivision();
      setupShortDivision();
      switchTab("long");
      initCanvas();
      new ResizeObserver(drawBringDownArrows).observe(document.getElementById("longBoard"));
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    });
  </script>
  <script src="./board.js"></script>
</body>
</html>

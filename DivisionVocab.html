<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Vocabulary Adventures!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {font-family:'Fredoka',cursive;background:linear-gradient(to bottom right,#fdf6e3,#fdf4d7);margin:0;padding:20px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;color:#333;overflow-x:hidden;box-sizing:border-box}.container{background-color:#fff;border-radius:20px;box-shadow:0 15px 30px rgba(0,0,0,.1);padding:30px 40px;max-width:900px;width:100%;text-align:center;position:relative;opacity:0;transform:translateY(20px);animation:fadeInSlideUp 1s forwards ease-out .5s}@keyframes fadeInSlideUp{to{opacity:1;transform:translateY(0)}}.title{font-size:3.5em;color:#4CAF50;margin-bottom:30px;text-shadow:2px 2px 5px rgba(0,0,0,.1);letter-spacing:1px;position:relative;padding-bottom:10px}.title::after{content:'';display:block;width:80px;height:6px;background:#FFC107;margin:10px auto 0;border-radius:3px}.terms-legend{display:flex;justify-content:center;gap:20px;margin-bottom:40px;opacity:0;transform:translateY(20px)}.term-box{background-color:#8BC34A;color:white;padding:10px 20px;border-radius:25px;font-size:1.3em;font-weight:bold;cursor:pointer;transition:all .3s ease;box-shadow:0 4px 8px rgba(0,0,0,.1)}.term-box:hover{background-color:#7CB342;transform:translateY(-3px) scale(1.02);box-shadow:0 6px 12px rgba(0,0,0,.15)}.division-example{margin-bottom:50px;padding:30px;border-radius:15px;background-color:#f8fcf8;box-shadow:inset 0 0 15px rgba(0,0,0,.05);display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;opacity:0;transform:translateY(20px)}.divider{width:80%;height:5px;background:repeating-linear-gradient(45deg,#FFC107,#FFC107 10px,#FFEB3B 10px,#FFEB3B 20px);border-radius:3px;margin:40px auto;opacity:.8;opacity:0;transform:translateY(20px)}.equation{display:flex;align-items:center;font-size:3em;font-weight:bold;gap:15px}.number{color:#3F51B5;padding:5px 10px;border-radius:8px;transition:all .3s ease;cursor:pointer;position:relative;z-index:2}.number.highlight{background-color:#FFEB3B;transform:scale(1.1) rotate(2deg);box-shadow:0 0 15px #FFEB3B;color:#D32F2F}.operator{color:#FF5722;font-size:1.2em}.labels{display:flex;justify-content:center;gap:20px;margin-top:20px;flex-wrap:wrap}.label-group{display:flex;align-items:center;flex-direction:column;position:relative;z-index:1}.label-text{background-color:#2196F3;color:white;padding:8px 15px;border-radius:20px;font-size:1.1em;font-weight:bold;cursor:pointer;transition:background-color .3s ease,transform .3s ease;white-space:nowrap}.label-text:hover{background-color:#1976D2;transform:translateY(-2px)}.arrow{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;transition:border-color .3s ease;position:absolute}.arrow-up{border-bottom:15px solid #2196F3;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%)}.arrow-right{border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid #2196F3;left:calc(100% + 5px);top:50%;transform:translateY(-50%)}.arrow-left{border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:15px solid #2196F3;right:calc(100% + 5px);top:50%;transform:translateY(-50%)}.example-1 .equation{gap:30px}.example-1 .labels{position:absolute;bottom:-5px;left:0;width:100%;justify-content:space-around;align-items:flex-start;flex-wrap:nowrap}.example-1 .label-group{flex-direction:column-reverse;align-items:center;position:absolute}.example-1 .label-group .arrow{position:static;transform:none;margin-bottom:5px}.example-1 .label-group.dividend-label{left:18%}.example-1 .label-group.divisor-label{left:47%}.example-1 .label-group.quotient-label{left:77%}.example-2 .equation{flex-direction:column;font-size:4em;gap:0;position:relative;width:fit-content;margin-right:250px}.long-division-top{position:relative;margin-bottom:-15px}.long-division-bottom{display:flex;align-items:baseline;position:relative}.long-division-bar{border-top:5px solid #3F51B5;border-left:5px solid #3F51B5;height:1.2em;width:1.5em;border-radius:5px 0 0 0;margin-right:10px;box-sizing:content-box;display:inline-block}.example-2 .labels{position:absolute;right:20px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-start;gap:25px;margin:0}.example-2 .label-group{flex-direction:row;align-items:center;gap:10px}.example-2 .label-group .arrow{position:static;transform:none;margin:0}.example-2 .label-group.divisor-label{flex-direction:row-reverse}.example-3 .equation{flex-direction:row;align-items:center;font-size:3.5em;gap:10px}.fraction-division .number.top-number,.fraction-division .number.bottom-number{display:block;text-align:center;line-height:1;margin:0}.fraction-division .number.top-number{margin-bottom:5px}.fraction-division .number.bottom-number{margin-top:5px}.fraction-line{width:60px;height:5px;background-color:#3F51B5;border-radius:2px}.example-3 .labels{position:absolute;right:20px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-start;gap:30px;margin:0}.example-3 .label-group{flex-direction:row;align-items:center;gap:10px}.example-3 .label-group .arrow{position:static;transform:none;margin:0}.term-box.active,.label-text.active{background-color:#FFC107;transform:scale(1.05);box-shadow:0 0 20px #FFC107}.label-text.active+.arrow.arrow-up{border-bottom-color:#FFC107!important}.label-text.active+.arrow.arrow-right{border-left-color:#FFC107!important}.label-group.divisor-label .label-text.active~.arrow.arrow-left{border-right-color:#FFC107!important}@media(max-width:768px){body{padding:10px}.container{padding:20px;box-shadow:none}.title{font-size:2.5em;margin-bottom:20px}.terms-legend{flex-direction:column;gap:10px;margin-bottom:30px}.term-box{padding:8px 15px;font-size:1.1em}.division-example{padding:20px 10px;margin-bottom:30px}.equation{font-size:2em;gap:8px;flex-wrap:wrap;justify-content:center}.number{padding:3px 8px}.operator{font-size:1em}.example-1 .labels{position:static;flex-direction:column;justify-content:center;align-items:center;margin-top:20px;gap:10px}.example-1 .label-group{position:static;flex-direction:row;justify-content:center;align-items:center;width:100%;gap:5px}.example-1 .label-group .arrow{display:none}.example-2 .equation,.example-3 .equation{margin-right:0;font-size:2.5em}.example-2 .labels,.example-3 .labels{position:static;transform:none;margin-top:20px;align-items:center;gap:15px}.long-division-bar{height:1em;width:1em}.fraction-line{width:40px}}
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Division Vocabulary</h1>
        <div class="terms-legend"><span class="term-box" data-term="dividend">dividend</span><span class="term-box" data-term="divisor">divisor</span><span class="term-box" data-term="quotient">quotient</span></div>
        <div class="division-example example-1"><div class="equation"><span class="number dividend" data-term="dividend">20</span><span class="operator">÷</span><span class="number divisor" data-term="divisor">4</span><span class="operator">=</span><span class="number quotient" data-term="quotient">5</span></div><div class="labels"><div class="label-group dividend-label"><span class="arrow arrow-up"></span><span class="label-text" data-term="dividend">dividend</span></div><div class="label-group divisor-label"><span class="arrow arrow-up"></span><span class="label-text" data-term="divisor">divisor</span></div><div class="label-group quotient-label"><span class="arrow arrow-up"></span><span class="label-text" data-term="quotient">quotient</span></div></div></div>
        <div class="divider"></div>
        <div class="division-example example-2"><div class="equation long-division"><div class="long-division-top"><span class="number quotient" data-term="quotient">5</span></div><div class="long-division-bottom"><span class="number divisor" data-term="divisor">4</span><span class="long-division-bar"></span><span class="number dividend" data-term="dividend">20</span></div></div><div class="labels long-division-labels"><div class="label-group quotient-label"><span class="arrow arrow-right"></span><span class="label-text" data-term="quotient">quotient</span></div><div class="label-group dividend-label"><span class="arrow arrow-right"></span><span class="label-text" data-term="dividend">dividend</span></div><div class="label-group divisor-label"><span class="label-text" data-term="divisor">divisor</span><span class="arrow arrow-left"></span></div></div></div>
        <div class="divider"></div>
        <div class="division-example example-3"><div class="equation fraction-division"><span class="number dividend top-number" data-term="dividend">20</span><span class="fraction-line"></span><span class="number divisor bottom-number" data-term="divisor">4</span><span class="operator">=</span><span class="number quotient" data-term="quotient">5</span></div><div class="labels fraction-labels"><div class="label-group dividend-label"><span class="arrow arrow-right"></span><span class="label-text" data-term="dividend">dividend</span></div><div class="label-group divisor-label"><span class="arrow arrow-right"></span><span class="label-text" data-term="divisor">divisor</span></div><div class="label-group quotient-label"><span class="arrow arrow-right"></span><span class="label-text" data-term="quotient">quotient</span></div></div></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded',()=>{const termBoxes=document.querySelectorAll('.term-box'),labelTexts=document.querySelectorAll('.label-text'),numbers=document.querySelectorAll('.number');function clear(){termBoxes.forEach(b=>b.classList.remove('active'));labelTexts.forEach(l=>l.classList.remove('active'));numbers.forEach(n=>n.classList.remove('highlight'))}function apply(term){clear();document.querySelectorAll(`.term-box[data-term="${term}"]`).forEach(b=>b.classList.add('active'));document.querySelectorAll(`.label-text[data-term="${term}"]`).forEach(l=>l.classList.add('active'));document.querySelectorAll(`.number.${term}`).forEach(n=>n.classList.add('highlight'))}termBoxes.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.term)));labelTexts.forEach(l=>l.addEventListener('click',()=>apply(l.dataset.term)));numbers.forEach(n=>n.addEventListener('click',()=>apply(n.dataset.term)));document.querySelectorAll('.terms-legend,.division-example,.divider').forEach((el,i)=>{el.style.animation=`fadeInSlideUp .8s forwards ease-out ${1+i*.2}s`});document.addEventListener('click',e=>{if(!e.target.closest('.term-box')&&!e.target.closest('.label-text')&&!e.target.closest('.number'))clear()})});
    </script>
</body>
</html>
